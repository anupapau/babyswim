<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:        #07111e;
  --bg2:       #0c1c2e;
  --bg3:       #102034;
  --surface:   #0f2236;
  --surface2:  #152a42;
  --border:    rgba(99,173,255,0.12);
  --border2:   rgba(99,173,255,0.2);
  --text:      #e4edf5;
  --text2:     #8ba7bf;
  --text3:     #4a6580;
  --accent:    #3b82f6;
  --accent2:   #60a5fa;
  --success:   #22c55e;
  --warning:   #f59e0b;
  --danger:    #ef4444;
  --radius:    10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow:    0 4px 24px rgba(0,0,0,0.4);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --font:      'IBM Plex Sans', system-ui, sans-serif;
  --mono:      'IBM Plex Mono', monospace;
}

body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 20px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

#app{
  zoom: 1.15;
}

/* Counteract zoom on 100vh elements */
.vh100{ height: calc(100vh / 1.15); }

/* ── Mobile overrides ── */
@media(max-width:768px){
  body{ font-size:15px; }
  #app{ zoom:1; }
  .vh100{ height:100vh; }

  /* App layout: stack vertically, sidebar hidden */
  #app > div[style*="display:flex"]{
    flex-direction: column !important;
  }

  /* Sidebar: hide on mobile */
  .sidebar-desktop{ display:none !important; }

  /* Main: full width, leave room for bottom nav */
  .main-scroll{
    padding-bottom: 70px !important;
  }

  /* Topbar: compact */
  .topbar-inner{
    padding: 10px 14px !important;
    flex-wrap: nowrap !important;
    gap: 8px !important;
  }
  .topbar-legend{ display:none !important; }
  .topbar-share span{ display:none; }

  /* Bottom nav bar */
  .mobile-nav{ display:flex !important; }

  /* Content padding */
  .main-content{
    padding: 14px 12px !important;
    max-width: 100% !important;
  }

  /* Modals: full screen on mobile */
  .modal{
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0 !important;
    padding: 20px 16px !important;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay{
    align-items: flex-end !important;
    padding: 0 !important;
  }

  /* Cards: full width — except calendar and swimmer grids */
  div[style*="grid-template-columns"]:not(.cal-grid):not(.sw-grid){
    grid-template-columns: 1fr !important;
  }

  /* Stat rows: 2 columns */
  div[style*="minWidth:\"60px\""]{
    min-width: 60px;
  }

  /* Tables and wide rows: allow horizontal scroll */
  div[style*="overflowX:\"auto\""]{
    overflow-x: auto;
  }

  /* Buttons: larger tap targets */
  button{ min-height: 36px; }

  /* Input sizes */
  .iS{ font-size:16px !important; } /* prevents iOS zoom on input focus */
}

/* Mobile bottom nav */
.mobile-nav{
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border2);
  z-index: 100;
  padding: 6px 4px max(8px, env(safe-area-inset-bottom));
  justify-content: space-around;
  align-items: center;
}
.mobile-nav button{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text3);
  font-weight: 600;
  padding: 5px 4px;
  min-height: unset;
  border-radius: 10px;
  flex: 1;
  min-width: 0;
}
.mobile-nav button.active{
  color: var(--accent2);
  background: rgba(59,130,246,0.12);
}
.mobile-nav button span.icon{ font-size: 22px; line-height:1; }
.mobile-nav button span.label{ font-size: 9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }


button{font-family:var(--font);cursor:pointer;transition:opacity 0.15s,background 0.15s,border-color 0.15s;}
button:hover{opacity:0.88;}
select,input,textarea{font-family:var(--font);}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(3,9,18,0.82);
  backdrop-filter:blur(4px);
  z-index:1000;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:fadeIn 0.15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 100%;
  max-width: 440px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
  animation: slideUp 0.18s ease;
}
@keyframes slideUp{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-sm{max-width:400px;}

/* Inputs */
.iS{
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.iS:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
.iS::placeholder{color:var(--text3);}

/* Labels */
.lS{
  font-size: 11px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 600;
  display: block;
  margin-bottom: 5px;
}

/* Mobile user info — hidden on desktop (sidebar handles it) */
.mobile-overview{ display:none; }
@media(max-width:768px){ .mobile-overview{ display:flex !important; } }
.mobile-bell{ display:none; }
.topbar-title{ display:block; }
/* Topbar hidden on desktop — sidebar handles nav */
.topbar-inner{ display:none !important; }
/* Sidebar hidden on mobile */
.sidebar-desktop{ display:flex; }

@media(max-width:768px){
  .mobile-user-info{ display:flex !important; }
  .mobile-bell{ display:flex !important; }
  .topbar-title{ display:none !important; }
  .topbar-inner{ display:flex !important; padding:8px 12px !important; }
  .sidebar-desktop{ display:none !important; }
}

/* Admin-add-list stays scrollable */
.admin-add-list{overflow-y:auto;}
</style>

function seedTimetableStudents(){
  TIMETABLE_SEED.forEach(entry=>{
    const w=entry.week;
    if(!state.weeklyClasses[w]){
      const template=JSON.parse(JSON.stringify(CLASSES));
      template.forEach(c=>{c.id=c.id+Math.floor(Math.random()*1e9);c.coachId=1;});
      state.weeklyClasses[w]=template;
    }
    const cls=state.weeklyClasses[w].find(c=>c.day===entry.day&&c.time===entry.time);
    if(!cls)return;
    if(cls.students.some(s=>s.name.trim().toLowerCase()===entry.childName.trim().toLowerCase()))return;
    const sw=state.swimmers.find(s=>s.name.trim().toLowerCase()===entry.childName.trim().toLowerCase());
    cls.students.push({
      id:sw?sw.id:(90000+Math.floor(Math.random()*9999)),
      name:entry.childName,
      parentName:entry.parentName||sw?.parentName||"",
      dob:sw?.dob||"",
      age:entry.age||sw?.age||"",
      attendance:"confirmed",
      staple:false,
      pkg:sw?.pkg||"group",
      transferTo:null,
    });
    if(sw&&!sw.assignedClassId){
      sw.assignedClassId=cls.id;
      sw.assignedLabel=cls.day+" "+cls.time;
    }
  });
}

// ── DOM helper ─────────────────────────────────────────────────
function el(tag,attrs,...children){
  const elem=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(elem.style,v);
    else if(k.startsWith("on")&&typeof v==="function")elem.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")elem.className=v;
    else if(k==="disabled")elem.disabled=v;
    else elem.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{if(c==null||c===false)return;elem.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);});
  return elem;
}

function buildDobPicker(dKey,mKey,yKey,onChange){
  const wrap=el("div",{style:{display:"flex",gap:"6px"}});
  const ss={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"6px",padding:"6px 8px",color:"var(--text)",fontSize:"11px",outline:"none",flex:1};
  const dSel=el("select",{style:ss});dSel.appendChild(el("option",{value:""},"Day"));
  for(let i=1;i<=31;i++){const o=el("option",{value:String(i)},String(i));if(String(state[dKey])===String(i))o.selected=true;dSel.appendChild(o);}
  dSel.addEventListener("change",e=>{state[dKey]=e.target.value;onChange();});
  const mSel=el("select",{style:ss});mSel.appendChild(el("option",{value:""},"Month"));
  MONTHS.forEach((mn,i)=>{const o=el("option",{value:String(i+1)},mn);if(String(state[mKey])===String(i+1))o.selected=true;mSel.appendChild(o);});
  mSel.addEventListener("change",e=>{state[mKey]=e.target.value;onChange();});
  const curY=new Date().getFullYear();
  const ySel=el("select",{style:ss});ySel.appendChild(el("option",{value:""},"Year"));
  for(let y=curY;y>=curY-8;y--){const o=el("option",{value:String(y)},String(y));if(String(state[yKey])===String(y))o.selected=true;ySel.appendChild(o);}
  ySel.addEventListener("change",e=>{state[yKey]=e.target.value;onChange();});
  wrap.appendChild(dSel);wrap.appendChild(mSel);wrap.appendChild(ySel);
  return wrap;
}

function isPoolClosed(dateStr){return !!state.poolClosures[dateStr];}

function isPoolHalfClosed(dateStr){const c=state.poolClosures[dateStr];return c&&c.type==="half";}
function isClassTimeClosedByHalfDay(dateStr,classTime){
  const c=state.poolClosures[dateStr];
  if(!c||c.type!=="half")return false;
  if(!c.from||!c.to||!classTime)return true; // no time range = treat as full
  return classTime>=c.from&&classTime<=c.to;
}
function togglePoolClosed(dateStr,reason=""){

}
function isClassCountable(c){
  // Open class (no students) → NOT counted
  if(c.students.length===0)return false;
  // Everything else (normal, cancelled, or manually closed with students) → counted
  return true;
}
function getCoachClassesInMonth(coachId,year,month){
  const prefix=year+"-"+String(month+1).padStart(2,"0");
  const today=new Date();today.setHours(23,59,59,999);
  let classes=[];
  Object.entries(state.weeklyClasses).forEach(([wIso,cls])=>{
    if(!wIso.startsWith(String(year)))return;
    const weekDate=new Date(wIso+"T00:00:00");
    cls.filter(c=>c.coachId===coachId&&isClassCountable(c)).forEach(c=>{
      const dayOff={Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Friday:4,Saturday:5,Sunday:6}[c.day]||0;
      const classDate=new Date(weekDate);classDate.setDate(weekDate.getDate()+dayOff);
      if(classDate>today)return; // skip future classes
      const dateStr=isoDate(classDate);
      if(dateStr.startsWith(prefix))classes.push({...c,date:dateStr});
    });
  });
  return classes;
}
function calcCoachSalary(coach,year,month){
  const classes=getCoachClassesInMonth(coach.id,year,month);
  const slots=classes.length; // each class = 0.5hr slot
  let base=0;
  if(coach.payType==="hourly"){
    base=Math.round((coach.hourlyRate||0)*0.5*slots);
  } else {
    base=coach.monthlyBase||0;
  }
  const bonusTotal=(coach.bonuses||[]).filter(b=>{
    const bDate=b.date||"";
    return bDate.startsWith(year+"-"+String(month+1).padStart(2,"0"));
  }).reduce((s,b)=>s+(b.amount||0),0);
  return{slots,hours:slots*0.5,base,bonusTotal,total:base+bonusTotal};
}
function calcMonthlyProfit(year,month){
  const mPrefix=year+"-"+String(month+1).padStart(2,"0");
  const breakdown={private:0,group:0,dropin:0,tryout:0,other:0};
  let realIncome=0;
  state.registrations.forEach(r=>{
    (r.packages||[]).filter(p=>(p.startedAt||"").startsWith(mPrefix)&&p.payment).forEach(p=>{
      const amt=p.payment||0;
      realIncome+=amt;
      if(breakdown[p.type]!==undefined)breakdown[p.type]+=amt;
      else breakdown.other+=amt;
    });
  });
  const totalSalary=state.coaches.reduce((s,ch)=>s+calcCoachSalary(ch,year,month).total,0);
  return{realIncome,totalSalary,profit:realIncome-totalSalary,breakdown};
}

function addSt(classId,sw,pkgType){
  const cls=adminCls().find(c=>c.id===classId);
  if(!cls)return;
  const activeStudents=cls.students.filter(s=>!s.transferTo&&s.attendance!=="cancelled").length;
  const overCap=activeStudents>=cls.capacity;
  if(overCap){
    if(!(cls.waitingList||[]).some(w=>w.name===sw.name)){
      setAdminCls(adminCls().map(c=>c.id!==classId?c:{...c,waitingList:[...(c.waitingList||[]),{id:Date.now()+Math.random(),name:sw.name,dob:sw.dob||"",age:sw.age||"",parentName:sw.parentName||"",pkg:sw.pkg||"group",requestedAt:todayStr()}]}));

      state.overCapAlert.push(sw.name);
    }
    return;
  }

function handleCSV(file){
  state.csvErr="";state.csvOk="";if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const lines=ev.target.result.trim().split(/\r?\n/);
      if(lines.length<2){state.csvErr="No valid rows.";render();return;}
      const hdrs=lines[0].split(",").map(h=>h.trim().toLowerCase());
      const parsed=lines.slice(1).map((line,i)=>{
        const vals=line.split(",").map(v=>v.trim());
        const obj={id:Date.now()+i+Math.random()};
        hdrs.forEach((h,hi)=>{obj[h]=vals[hi]||"";});
        obj.name=obj.name||obj["baby name"]||obj["swimmer"]||"Unknown";
        obj.dob=obj.dob||obj["date of birth"]||obj["date_of_birth"]||"";
        obj.age=obj.dob?"":obj.age||"—";
        obj.parentName=obj.parentname||obj["parent name"]||obj.parent||"";
        obj.memberId=obj.memberid||obj["member id"]||obj["member_id"]||obj["memberid"]||"";
        obj.pkg=(obj.package||obj.pkg||"").toLowerCase().includes("priv")?"private":"group";
        obj.assignedClassId=null;obj.babyId=genBabyId();return obj;
      }).filter(r=>r.name&&r.name!=="Unknown");
      if(!parsed.length){state.csvErr="No valid rows.";render();return;}
      const ex=new Set(state.swimmers.map(s=>s.name.toLowerCase()));
      const fr=parsed.filter(x=>!ex.has(x.name.toLowerCase()));
      state.swimmers=[...state.swimmers,...fr];state.csvOk="Imported "+fr.length+" swimmer(s).";render();
    }catch(e){state.csvErr="Parse error.";render();}
  };r.readAsText(file);
}

      const top=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",marginBottom:"6px"}});
      top.appendChild(el("div",{style:{flex:1}},
        el("div",{style:{fontSize:"11px",color:"var(--text)",fontWeight:600}},r.coachName+" · "+dateLabel+(r.days>1?" ("+r.days+" days)":"")),
        el("div",{style:{fontSize:"9px",color:"var(--text3)",marginTop:"2px"}},(r.note||"No reason given")+" · "+r.submittedAt)));
      top.appendChild(el("span",{style:{fontSize:"9px",color:statusColor,background:r.status==="approved"?"#052e16":r.status==="rejected"?"#450a0a":"#1c1100",borderRadius:"4px",padding:"2px 8px",border:"1px solid "+(r.status==="approved"?"#166534":r.status==="rejected"?"#7f1d1d":"#92400e"),fontWeight:700,textTransform:"uppercase"}},r.status));
      row.appendChild(top);
      if(r.status==="pending"){

          state.leaveRequests=state.leaveRequests.map(x=>x.id!==r.id?x:{...x,status:"approved",adminNote:state[noteKey]||""});
          delete state[noteKey];render();
        },style:{padding:"5px 14px",borderRadius:"6px",border:"none",fontSize:"11px",fontWeight:700,background:"#16a34a",color:"#fff",cursor:"pointer"}},"✓ Approve"));
        actRow.appendChild(el("button",{onClick:()=>{
          state.leaveRequests=state.leaveRequests.map(x=>x.id!==r.id?x:{...x,status:"rejected",adminNote:state[noteKey]||""});
          delete state[noteKey];render();
        },style:{padding:"5px 14px",borderRadius:"6px",border:"1px solid #7f1d1d",fontSize:"11px",fontWeight:700,background:"#450a0a",color:"#f87171",cursor:"pointer"}},"✕ Reject"));
        row.appendChild(noteInp);row.appendChild(actRow);
      } else if(r.adminNote){
        row.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",fontStyle:"italic",marginTop:"2px"}},'Admin: "'+r.adminNote+'"'));
      }
      tbl.appendChild(row);
    });
    lrSection.appendChild(tbl);
  }
  wrap.appendChild(lrSection);
  return wrap;
}

      const pI=el("input",{type:"number",className:"iS",placeholder:"Price ฿",value:ed.price,min:0,style:{width:"90px"}});
      pI.addEventListener("input",e=>{state.pkgTypeEdit={...ed,price:parseFloat(e.target.value)||0};});
      r1.appendChild(lI);r1.appendChild(cI);r1.appendChild(pI);card.appendChild(r1);
      // Color picker
      const colorRow=el("div",{style:{display:"flex",gap:"5px",flexWrap:"wrap",marginBottom:"10px"}});

        colorRow.appendChild(dot);
      });
      card.appendChild(colorRow);
      const btnRow=el("div",{style:{display:"flex",gap:"6px"}});

      },style:{flex:1,padding:"6px 0",borderRadius:"6px",border:"none",fontSize:"11px",fontWeight:700,background:"#2563eb",color:"#fff",cursor:"pointer"}},"Save"));
      btnRow.appendChild(el("button",{onClick:()=>{state.pkgTypeEdit=null;render();},style:{padding:"6px 10px",borderRadius:"6px",border:"1px solid var(--border)",fontSize:"11px",background:"var(--bg3)",color:"var(--text3)",cursor:"pointer"}},"Cancel"));

      const row=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap"}});
      const badge=el("span",{style:{fontSize:"10px",background:p.bg,color:p.color,borderRadius:"4px",padding:"2px 10px",border:`1px solid ${p.border}`,fontWeight:700}},p.label);

      card.appendChild(row);
    }
    wrap.appendChild(card);
  });

  return wrap;

// ── Class Type Confirm Modal ────────────────────────────────────
function buildPkgTypeConfirmModal(){
  if(!state.pkgTypeConfirm)return null;
  const c=state.pkgTypeConfirm;
  const dismiss=()=>{state.pkgTypeConfirm=null;render();};
  const isDelete=c.action==="delete";
  const isAdd=c.action==="add";
  const title=isDelete?"🗑 Delete Class Type":isAdd?"➕ Add Class Type":"✏ Update Class Type";
  const confirmAction=()=>{
    if(isDelete){
      delete PKG_TYPES[c.key];
      // Remove deleted type's packages from registrations gracefully
    } else if(isAdd){
      // pick a colour from COLORS that's not used
      const usedColors=Object.values(PKG_TYPES).map(p=>p.color);
      const fallbackColors=["#e879f9","#38bdf8","#fbbf24","#a3e635","#f87171","#34d399","#fb923c","#a78bfa"];
      const freeColor=fallbackColors.find(c=>!usedColors.includes(c))||"#94a3b8";
      const idx=fallbackColors.indexOf(freeColor);
      const bgs=["#2e0a3a","#0c1a2e","#1c1100","#0f2000","#450a0a","#022c22","#1c0a00","#1e1b4b"];
      const borders=["#7e22ce","#0369a1","#92400e","#4d7c0f","#7f1d1d","#065f46","#9a3412","#4338ca"];
      PKG_TYPES[c.key]={label:c.label,classes:c.classes,price:c.price,color:freeColor,bg:bgs[idx]||"#0a1a2e",border:borders[idx]||"#1e3a5f"};
    } else {
      // edit
      PKG_TYPES[c.key]={...PKG_TYPES[c.key],...c.ed,label:c.ed.label,classes:c.ed.classes,price:c.ed.price,color:c.ed.color,bg:c.ed.bg,border:c.ed.border};
      // Update pkgPrices
      state.pkgPrices[c.key]=c.ed.price;
    }
    state.pkgTypeEdit=null;state.pkgTypeNewName="";state.pkgTypeNewClasses="8";state.pkgTypeNewPrice="0";state.pkgTypeNewErr="";
    state.pkgTypeConfirm=null;render();
  };
  return el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)dismiss();}},
    el("div",{className:"modal modal-sm"},
      el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},
        el("h2",{style:{fontSize:"15px",color:isDelete?"#f87171":isAdd?"#60a5fa":"#e2e8f0",fontWeight:700}},title),
        el("button",{onClick:dismiss,style:{background:"#1e3a5f",border:"none",color:"var(--text2)",borderRadius:"6px",padding:"4px 10px",fontSize:"13px"}},"✕")),
      el("div",{style:{background:"var(--bg2)",borderRadius:"8px",padding:"12px",marginBottom:"16px",border:"1px solid var(--border)"}},
        isDelete
          ?el("div",null,el("div",{style:{fontSize:"12px",color:"#f87171",fontWeight:600,marginBottom:"4px"}},c.label),el("div",{style:{fontSize:"11px",color:"var(--text3)"}},"This will remove the package type system-wide. Existing registrations with this type will be unaffected."))
          :el("div",null,
            el("div",{style:{fontSize:"12px",color:"var(--text)",fontWeight:600,marginBottom:"6px"}},(c.ed||c).label||c.label),
            el("div",{style:{display:"flex",gap:"12px",flexWrap:"wrap"}},
              el("div",null,el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase"}},"Classes"),el("div",{style:{fontSize:"14px",color:"#93c5fd",fontWeight:700}},(c.ed?.classes||c.classes)+"×")),
              el("div",null,el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase"}},"Price"),el("div",{style:{fontSize:"14px",color:"#4ade80",fontWeight:700}},"฿"+(c.ed?.price||c.price||0).toLocaleString()))),
            !isAdd?el("div",{style:{fontSize:"10px",color:"#fbbf24",marginTop:"8px"}},"⚠ This will update pricing and class count for all new packages of this type."):null)),
      el("div",{style:{display:"flex",gap:"8px"}},
        el("button",{onClick:confirmAction,style:{flex:1,padding:"10px 0",borderRadius:"8px",border:"none",fontSize:"13px",fontWeight:700,background:isDelete?"#dc2626":"#16a34a",color:"#fff",cursor:"pointer"}},isDelete?"Delete":"Confirm"),
        el("button",{onClick:dismiss,style:{padding:"10px 16px",borderRadius:"8px",border:"1px solid var(--border)",fontSize:"12px",background:"var(--bg3)",color:"var(--text3)",cursor:"pointer"}},"Cancel"))));
}

// ── Share Modal ────────────────────────────────────────────────
function buildShareModal(){
  if(!state.shareModal)return null;
  const sm=state.shareModal;
  const dismiss=()=>{state.shareModal=null;render();};
  const selStyle={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"8px 12px",color:"var(--text)",fontSize:"13px",outline:"none",width:"100%"};

  const availDays=DAYS.filter(d=>adminCls().some(c=>c.day===d));

  const overlay=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)dismiss();}});
  const box=el("div",{className:"modal modal-sm"});

  box.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"20px"}},
    el("h2",{style:{fontSize:"15px",color:"var(--text)",fontWeight:700}},"📤 Share Schedule"),
    el("button",{onClick:dismiss,style:{background:"var(--surface2)",border:"none",color:"var(--text2)",borderRadius:"6px",padding:"4px 10px",fontSize:"13px"}},"✕")));

  // Day select
  box.appendChild(el("div",{style:{marginBottom:"14px"}},el("label",{className:"lS"},"Day")));
  const daySel=el("select",{style:selStyle});
  availDays.forEach(d=>{
    const dt=new Date();const todayIdx=dt.getDay()===0?6:dt.getDay()-1;
    const dayIdx=DAYS.indexOf(d);let diff=dayIdx-todayIdx;if(diff<=0)diff+=7;
    const target=new Date(dt);target.setDate(dt.getDate()+diff);
    const o=el("option",{value:d},d+" · "+target.toLocaleDateString("en-GB",{day:"numeric",month:"short"}));
    if(d===sm.day)o.selected=true;
    daySel.appendChild(o);
  });
  box.lastChild.appendChild(daySel);

  // Coach select
  box.appendChild(el("div",{style:{marginBottom:"14px"}},el("label",{className:"lS"},"Coach")));
  const coachSel=el("select",{style:selStyle});
  const rebuildCoachOptions=(day,selectedCoachId)=>{
    coachSel.innerHTML="";
    const o=el("option",{value:"all"},"All Coaches");
    if(selectedCoachId==="all")o.selected=true;
    coachSel.appendChild(o);
    state.coaches.filter(ch=>adminCls().some(c=>c.day===day&&c.coachId===ch.id)).forEach(ch=>{
      const opt=el("option",{value:ch.id},ch.name);
      if(String(ch.id)===String(selectedCoachId))opt.selected=true;
      coachSel.appendChild(opt);
    });
  };
  rebuildCoachOptions(sm.day,sm.coachId);
  box.lastChild.appendChild(coachSel);

  // Buttons — declared before updatePreview so it can reference confirmBtn
  const confirmBtn=el("button",{onClick:()=>{
    const coachFilter=coachSel.value==="all"?null:parseInt(coachSel.value);
    openSharePanel(daySel.value,coachFilter);
    dismiss();
  },style:{flex:1,padding:"10px 0",borderRadius:"var(--radius-sm)",border:"none",fontSize:"13px",fontWeight:700,cursor:"pointer",background:"#2563eb",color:"#fff"}},"📤 Share");

  // Preview label
  const previewLabel=el("div",{style:{background:"var(--bg2)",borderRadius:"var(--radius-sm)",padding:"10px 14px",marginBottom:"16px",fontSize:"12px",color:"var(--text3)",border:"1px solid var(--border)"}});
  const updatePreview=()=>{
    const count=adminCls().filter(c=>c.day===daySel.value&&(coachSel.value==="all"||c.coachId===parseInt(coachSel.value))).length;
    previewLabel.textContent=count>0?`${count} class${count!==1?"es":""} will be included`:"No classes match this selection";
    confirmBtn.disabled=count===0;
    confirmBtn.style.background=count>0?"#2563eb":"var(--surface2)";
    confirmBtn.style.color=count>0?"#fff":"var(--text3)";
    confirmBtn.style.cursor=count>0?"pointer":"not-allowed";
  };
  box.appendChild(previewLabel);

  // Wire change events without re-rendering
  daySel.addEventListener("change",()=>{
    sm.day=daySel.value;sm.coachId="all";
    rebuildCoachOptions(daySel.value,"all");
    updatePreview();
  });
  coachSel.addEventListener("change",()=>{sm.coachId=coachSel.value;updatePreview();});

  box.appendChild(el("div",{style:{display:"flex",gap:"8px"}},
    confirmBtn,
    el("button",{onClick:dismiss,style:{padding:"10px 16px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border)",fontSize:"12px",background:"transparent",color:"var(--text3)",cursor:"pointer"}},"Cancel")));

  updatePreview();
  overlay.appendChild(box);
  return overlay;
}

// ── Share text generator ───────────────────────────────────────
function generateShareText(day, coachFilter){
  const today=new Date();const todayIdx=today.getDay()===0?6:today.getDay()-1;
  const dayIdx=DAYS.indexOf(day);let diff=dayIdx-todayIdx;if(diff<=0)diff+=7;
  const targetDate=new Date(today);targetDate.setDate(today.getDate()+diff);
  const dateStr=targetDate.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  const tmrCls=adminCls().filter(c=>c.day===day&&(coachFilter===null||c.coachId===coachFilter)).sort((a,b)=>a.time.localeCompare(b.time));
  const coachName=coachFilter?state.coaches.find(ch=>ch.id===coachFilter)?.name:null;
  function ageStr(s){if(s.dob&&/^\d{4}-\d{2}-\d{2}$/.test(s.dob)){const m=Math.round((new Date()-new Date(s.dob+"T00:00:00"))/(1000*60*60*24*30.44));const yr=Math.floor(m/12),mo=m%12;return yr===0?mo+"mo":mo===0?yr+"yr":yr+"yr "+mo+"mo";}return s.age||"";}
  const lvEmoji={Guppy:"🐟",Turtle:"🐢",Dolphin:"🐬",Shark:"🦈",Orca:"🐋",Open:"✨"};
  let text=`🏊 RBSC Baby Swimming\n${dateStr}${coachName?" · "+coachName:""}\n\n`;
  if(!tmrCls.length){text+="No classes found.";return text;}
  tmrCls.forEach(c=>{
    const coach=state.coaches.find(ch=>ch.id===c.coachId);
    const lvCounts={};c.students.forEach(s=>{const l=a2l(s.dob||s.age);lvCounts[l]=(lvCounts[l]||0)+1;});
    const topLevel=c.students.length===0?"Open":(Object.entries(lvCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||"Open");
    const confirmed=c.students.filter(s=>s.attendance==="confirmed");
    const pending=c.students.filter(s=>s.attendance==="pending");
    text+=`⏰ ${c.time} — ${lvEmoji[topLevel]||"🏊"} ${topLevel} | 👤 ${coach?coach.name:"No coach"}\n`;
    if(confirmed.length)text+=`  ✅ ${confirmed.map(s=>s.name+(ageStr(s)?" ("+ageStr(s)+")":"")).join(", ")}\n`;
    if(pending.length)text+=`  ⏳ ${pending.map(s=>s.name+(ageStr(s)?" ("+ageStr(s)+")":"")).join(", ")}\n`;
    if(!c.students.length)text+=`  (No students)\n`;
    text+="\n";
  });
  return text.trim();
}

// ── Admin view ─────────────────────────────────────────────────
function buildAdminView(){
  const wrap=el("div",null);

  // Compute tryout counts for badge
  const pendingTryoutsMap={};
  const convertedTryoutsMap={};
  state.registrations.forEach(reg=>{
    (reg.packages||[]).forEach((pkg,pkgIdx)=>{
      if(pkg.type!=="tryout")return;
      const converted=(reg.packages||[]).slice(pkgIdx+1).some(p=>p.type!=="tryout");
      const sw=state.swimmers.find(s=>s.name===reg.swimmerName);
      const entry={swimmerName:reg.swimmerName,parentName:reg.parentName||sw?.parentName||"",babyId:sw?.babyId||"",date:pkg.startedAt||"",swId:sw?.id||null,regId:reg.id,converted};
      const key=reg.swimmerName.toLowerCase();
      if(converted){if(!convertedTryoutsMap[key]||entry.date>convertedTryoutsMap[key].date)convertedTryoutsMap[key]=entry;}
      else{if(!pendingTryoutsMap[key]||entry.date>pendingTryoutsMap[key].date)pendingTryoutsMap[key]=entry;}
    });
  });
  const pendingTryouts=Object.values(pendingTryoutsMap);
  const convertedTryouts=Object.values(convertedTryoutsMap);

  const tabs=[
    {id:"classes",label:"📋 Manage Class"},
    {id:"tryouts",label:"🟢 Tryouts"+(pendingTryouts.length?" ("+pendingTryouts.length+")":"")},
    {id:"bookings",label:"📅 Advance Booking"},
    {id:"closures",label:"🚫 Closures"},
  ];
  const tabBar=el("div",{style:{display:"flex",gap:"4px",marginBottom:"18px",borderBottom:"2px solid #1e3a5f",paddingBottom:"0"}});
  tabs.forEach(t=>{
    const active=state.adminTab===t.id;
    tabBar.appendChild(el("button",{onClick:()=>{state.adminTab=t.id;render();},style:{padding:"8px 16px",borderRadius:"8px 8px 0 0",border:"1px solid",fontSize:"12px",fontWeight:700,cursor:"pointer",borderColor:active?"#2563eb":"#1e3a5f",background:active?"#0f2a4a":"#0a1628",color:active?"#60a5fa":"#64748b",borderBottom:active?"2px solid #0f2a4a":"none",marginBottom:active?"-2px":"0"}},t.label));
  });
  wrap.appendChild(tabBar);
  if(state.adminTab==="classes")wrap.appendChild(buildClassManagement());
  else if(state.adminTab==="tryouts")wrap.appendChild(buildTryoutsTab(pendingTryouts,convertedTryouts));
  else if(state.adminTab==="closures")wrap.appendChild(buildClosuresTab());
  else wrap.appendChild(buildAdvanceBookings());
  return wrap;
}

function buildClosuresTab(){
  const wrap=el("div",null);
  const yr=state.closureCalYear;
  const mo=state.closureCalMonth;
  const now=new Date();

  // Month navigator
  const navRow=el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"20px"}});
  navRow.appendChild(el("button",{onClick:()=>{let m=mo-1,y=yr;if(m<0){m=11;y--;}state.closureCalMonth=m;state.closureCalYear=y;render();},style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"7px",padding:"6px 12px",color:"var(--text2)",fontSize:"14px",cursor:"pointer"}},"‹"));
  navRow.appendChild(el("span",{style:{fontSize:"14px",fontWeight:700,color:"var(--text)",flex:1,textAlign:"center"}},MONTHS[mo]+" "+yr));
  navRow.appendChild(el("button",{onClick:()=>{let m=mo+1,y=yr;if(m>11){m=0;y++;}state.closureCalMonth=m;state.closureCalYear=y;render();},style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"7px",padding:"6px 12px",color:"var(--text2)",fontSize:"14px",cursor:"pointer"}},"›"));
  if(yr!==now.getFullYear()||mo!==now.getMonth())navRow.appendChild(el("button",{onClick:()=>{state.closureCalMonth=now.getMonth();state.closureCalYear=now.getFullYear();render();},style:{padding:"5px 10px",borderRadius:"6px",border:"none",fontSize:"10px",background:"#2563eb",color:"#fff",cursor:"pointer"}},"Today"));
  wrap.appendChild(navRow);

  // Day-of-week headers
  const calGrid=el("div",{className:"cal-grid",style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px",marginBottom:"4px"}});
  ["M","T","W","T","F","S","S"].forEach(d=>{
    calGrid.appendChild(el("div",{style:{textAlign:"center",fontSize:"9px",color:"var(--text3)",fontWeight:700,padding:"3px 0"}},d));
  });
  wrap.appendChild(calGrid);

  // Calendar days
  const daysGrid=el("div",{className:"cal-grid",style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:"3px",marginBottom:"20px"}});
  const firstDay=new Date(yr,mo,1);
  const lastDay=new Date(yr,mo+1,0);
  const startOffset=(firstDay.getDay()+6)%7;

  for(let i=0;i<startOffset;i++){daysGrid.appendChild(el("div",{}));}

  for(let d=1;d<=lastDay.getDate();d++){
    const dateStr=`${yr}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const closure=state.poolClosures[dateStr];
    const isToday2=dateStr===isoDate(now);
    const isClosed=!!closure;
    const isHalf=closure?.type==="half";
    const isFull=closure?.type==="full"||isClosed&&!closure?.type;
    const isPast=dateStr<isoDate(now);
    const isSelected=state.closurePickDate===dateStr;

    const dayBtn=el("div",{style:{
      borderRadius:"6px",padding:"4px 2px",textAlign:"center",cursor:"pointer",
      border:"1px solid",
      borderColor:isSelected?"#60a5fa":isFull?"#7f1d1d":isHalf?"#92400e":isToday2?"#2563eb":"#1e3a5f",
      background:isSelected?"#1e3a5f":isFull?"#450a0a":isHalf?"#1c1100":isToday2?"#0f2a4a":"#061220",
      opacity:isPast&&!isClosed?0.4:1,
    }});

    dayBtn.appendChild(el("div",{style:{fontSize:"11px",fontWeight:700,color:isFull?"#f87171":isHalf?"#fbbf24":isToday2?"#60a5fa":isSelected?"#93c5fd":"var(--text)"}},d));
    if(isFull)dayBtn.appendChild(el("div",{style:{fontSize:"6px",color:"#f87171",lineHeight:1}},"🚫"));
    else if(isHalf)dayBtn.appendChild(el("div",{style:{fontSize:"6px",color:"#fbbf24",lineHeight:1}},"🌓"));
    else dayBtn.appendChild(el("div",{style:{fontSize:"6px",color:"#334155",lineHeight:1}},"·"));

    dayBtn.addEventListener("click",()=>{
      state.closurePickDate=state.closurePickDate===dateStr?null:dateStr;
      render();
    });
    daysGrid.appendChild(dayBtn);
  }
  wrap.appendChild(daysGrid);

  // Date action panel — appears when a date is selected
  if(state.closurePickDate){
    const d=new Date(state.closurePickDate+"T00:00:00");
    const label=d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
    const existing=state.poolClosures[state.closurePickDate];
    const panel=el("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"12px",padding:"14px",marginBottom:"16px"}});

    panel.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"12px"}},
      el("div",{style:{fontSize:"12px",fontWeight:700,color:"var(--text)"}},label),
      el("button",{onClick:()=>{state.closurePickDate=null;render();},style:{background:"none",border:"1px solid #334155",borderRadius:"6px",color:"var(--text3)",fontSize:"11px",padding:"3px 8px",cursor:"pointer"}},"✕")));

    if(existing){
      // Show current status + remove option
      const typeColor=existing.type==="half"?"#fbbf24":"#f87171";
      panel.appendChild(el("div",{style:{background:existing.type==="half"?"#1c1100":"#450a0a",border:"1px solid",borderColor:existing.type==="half"?"#92400e":"#7f1d1d",borderRadius:"8px",padding:"10px 12px",marginBottom:"12px"}},
        el("div",{style:{fontSize:"11px",fontWeight:700,color:typeColor}},(existing.type==="half"?"🌓 Partial Closure"+(existing.from&&existing.to?" · "+existing.from+"–"+existing.to:""):"🚫 Full Day Closure")),
        existing.reason?el("div",{style:{fontSize:"10px",color:"var(--text3)",marginTop:"3px"}},existing.reason):null));
      const btnRow=el("div",{style:{display:"flex",gap:"8px"}});
      btnRow.appendChild(el("button",{onClick:()=>{delete state.poolClosures[state.closurePickDate];state.closurePickDate=null;render();},style:{flex:1,padding:"8px",borderRadius:"7px",border:"1px solid #166534",background:"#052e16",color:"#4ade80",fontSize:"11px",fontWeight:700,cursor:"pointer"}},"🔓 Reopen Day"));
      panel.appendChild(btnRow);
    } else {
      // Show options to close
      panel.appendChild(el("div",{style:{fontSize:"10px",color:"var(--text3)",marginBottom:"10px"}},"Mark as:"));
      const typeRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"12px"}});
      [{type:"full",label:"🚫 Full Day",color:"#f87171",bg:"#450a0a",border:"#7f1d1d"},{type:"half",label:"🌓 Partial Closure",color:"#fbbf24",bg:"#1c1100",border:"#92400e"}].forEach(opt=>{
        const active=(state.closurePickType||"full")===opt.type;
        typeRow.appendChild(el("button",{onClick:()=>{state.closurePickType=opt.type;render();},style:{flex:1,padding:"10px 8px",borderRadius:"8px",border:"1px solid",borderColor:active?opt.border:"#334155",background:active?opt.bg:"#061220",color:active?opt.color:"#64748b",fontSize:"11px",fontWeight:700,cursor:"pointer"}},opt.label));
      });
      panel.appendChild(typeRow);

      // Time range for half day
      if((state.closurePickType||"full")==="half"){
        const timeRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"12px",alignItems:"center",flexWrap:"wrap"}});

        const fromInp=el("input",{type:"time",className:"iS",value:state.closurePickFrom||"08:00",style:{flex:1,fontSize:"13px"}});
        fromInp.addEventListener("change",e=>state.closurePickFrom=e.target.value);
        timeRow.appendChild(fromInp);
        timeRow.appendChild(el("span",{style:{fontSize:"10px",color:"var(--text3)",flexShrink:0}},"to"));
        const toInp=el("input",{type:"time",className:"iS",value:state.closurePickTo||"12:00",style:{flex:1,fontSize:"13px"}});
        toInp.addEventListener("change",e=>state.closurePickTo=e.target.value);
        timeRow.appendChild(toInp);
        panel.appendChild(timeRow);
      }

      const reasonInp=el("input",{className:"iS",placeholder:"Reason (optional) e.g. Public Holiday",value:state.closurePickReason||"",style:{marginBottom:"12px",fontSize:"12px"}});
      reasonInp.addEventListener("input",e=>state.closurePickReason=e.target.value);
      panel.appendChild(reasonInp);

      panel.appendChild(el("button",{onClick:()=>{
        const type=state.closurePickType||"full";
        state.poolClosures[state.closurePickDate]={
          type,
          from:type==="half"?(state.closurePickFrom||"08:00"):null,
          to:type==="half"?(state.closurePickTo||"12:00"):null,
          reason:state.closurePickReason||""
        };
        state.closurePickDate=null;state.closurePickReason="";state.closurePickFrom="08:00";state.closurePickTo="12:00";render();
      },style:{width:"100%",padding:"10px",borderRadius:"8px",border:"none",fontSize:"13px",fontWeight:700,background:"#dc2626",color:"#fff",cursor:"pointer"}},"Mark Closed"));
    }
    wrap.appendChild(panel);
  }

  // List of upcoming closures
  const upcoming=Object.entries(state.poolClosures)
    .filter(([d])=>d>=isoDate(now))
    .sort(([a],[b])=>a.localeCompare(b));
  const past=Object.entries(state.poolClosures)
    .filter(([d])=>d<isoDate(now))

    if(poolClosed&&closure?.reason)dayHead.appendChild(el("span",{style:{fontSize:"9px",color:"#4a6580",fontStyle:"italic"}},closure.reason));
    if(q&&!poolClosed){
      const matchCount=dc.reduce((s,c)=>s+c.students.filter(st=>st.name.toLowerCase().includes(q)||st.parentName?.toLowerCase().includes(q)).length,0);
      dayHead.appendChild(el("span",{style:{fontSize:"9px",color:"#60a5fa",background:"#0f2a4a",borderRadius:"4px",padding:"1px 7px",border:"1px solid #2563eb"}},matchCount+" match"+(matchCount!==1?"es":"")));
    }
    dayHead.appendChild(el("div",{style:{flex:1,height:"1px",background:"#1e3a5f"}}));

    // Pool closed toggle button
    const closeBtn=el("button",{onClick:e=>{
      e.stopPropagation();
      if(poolClosed){
        delete state.poolClosures[dayDateStr];
        render();
      } else {
        state.poolClosureModal=dayDateStr;
        render();
      }
    },style:{padding:"2px 9px",borderRadius:"6px",border:"1px solid",fontSize:"9px",fontWeight:600,cursor:"pointer",flexShrink:0,borderColor:poolClosed?"#166534":"#334155",background:poolClosed?"#052e16":"#0a1628",color:poolClosed?"#4ade80":"#64748b"}},poolClosed?"🔓 Reopen":"🚫 Pool Closed");
    dayHead.appendChild(closeBtn);

    if(!q)dayHead.appendChild(el("span",{style:{fontSize:"10px",color:"var(--text3)"}},isCol?"▶":"▼"));
    dayWrap.appendChild(dayHead);

    if(!isCol){
      if(poolClosed){

      } else {
        dc.forEach(c=>{
          if(q&&state.adminOpen!==c.id){state.adminOpen=c.id;}
          dayWrap.appendChild(buildAdminRow(c,q));
        });
      }
    }
    wrap.appendChild(dayWrap);
  });
  return wrap;
}

// ── Advance Booking helpers ─────────────────────────────────────
function injectAdvanceBookings(weekIso){
  const wkCls=clsForWeek(weekIso);if(!wkCls.length)return;
  const pending=state.advanceBookings.filter(b=>b.weekIso===weekIso&&b.status==="pending");
  if(!pending.length)return;
  let updated=JSON.parse(JSON.stringify(wkCls));let injected=0;
  pending.forEach(b=>{
    const ci=updated.findIndex(c=>c.day===b.day&&c.time===b.time);if(ci<0)return;
    if(updated[ci].students.some(s=>s.name===b.swimmerName))return;
    const sw=state.swimmers.find(s=>s.name===b.swimmerName&&s.active!==false);if(!sw)return;
    updated[ci].students.push({id:Date.now()+Math.random(),name:sw.name,dob:sw.dob||"",age:sw.age||"",parentName:sw.parentName||"",attendance:"confirmed",staple:false,pkg:sw.pkg||"group",transferTo:null,bookedAdvance:true});
    injected++;
  });
  if(injected){setWkCls(weekIso,updated);state.advanceBookings=state.advanceBookings.map(b=>b.weekIso===weekIso&&b.status==="pending"?{...b,status:"injected"}:b);}
}

    const compRegs=state.registrations.filter(r=>r.active===false&&(r.packages||[]).some(p=>p.sessions&&p.sessions.length>0));
    const compSwimmers={};
    compRegs.forEach(reg=>{
      const sw=state.swimmers.find(s=>s.name===reg.swimmerName)||state.swimmers.find(s=>s.parentName===reg.swimmerName)||state.swimmers.find(s=>s.parentName===reg.parentName);
      const childName=sw?.name||reg.swimmerName;
      const parent=sw?.parentName||reg.parentName||reg.swimmerName;
      const key=sw?.babyId||reg.swimmerName.toLowerCase();
      if(q&&!childName.toLowerCase().includes(q)&&!parent.toLowerCase().includes(q))return;
      if(!compSwimmers[key]){compSwimmers[key]={name:childName,parent,babyId:sw?.babyId||"",contact:sw?.contactNumber||reg.contactNumber||"",sw,packages:[]};}
      (reg.packages||[]).forEach(pkg=>{if(pkg.type!=="tryout")compSwimmers[key].packages.push(pkg);});
    });
    const compList=Object.values(compSwimmers).sort((a,b)=>a.name.localeCompare(b.name));
    if(compList.length===0){
      wrap.appendChild(el("div",{style:{textAlign:"center",padding:"40px",color:"var(--text3)",border:"1px dashed #1e3a5f",borderRadius:"10px"}},"No completed records found."));
      return wrap;
    }
    wrap.appendChild(el("div",{style:{fontSize:"10px",color:"var(--text3)",marginBottom:"8px"}},compList.length+" completed swimmers"));
    const tbl=el("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"12px",overflow:"hidden"}});
    compList.forEach((sw,si)=>{
      const isExpanded=!!state.regShowHistory["comp_"+sw.name];
      const totalSessions=(sw.packages||[]).reduce((s,p)=>s+(p.sessions?.length||0),0);
      const block=el("div",{style:{borderBottom:si<compList.length-1?"1px solid #0d1a2a":"none"}});
      const hdr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",padding:"10px 14px",background:si%2===0?"#0d1f33":"#0a1624",cursor:"pointer"},
        onClick:()=>{state.regShowHistory={...state.regShowHistory,["comp_"+sw.name]:!isExpanded};render();}});
      const nameBlock=el("div",{style:{flex:1,minWidth:"120px"}});
      const compChildName=sw.name||"";
      nameBlock.appendChild(el("div",{style:{fontSize:"11px",fontWeight:700,color:"#94a3b8",display:"flex",alignItems:"center",gap:"6px"}},
        compChildName,
        el("span",{style:{fontSize:"9px",background:"#052e16",color:"#4ade80",borderRadius:"3px",padding:"1px 6px",border:"1px solid #166534",fontWeight:600}},"✓ Done"),
        sw.babyId?el("span",{style:{fontSize:"9px",color:"#c084fc",fontFamily:"monospace",background:"#1a0a2e",borderRadius:"3px",padding:"1px 5px",border:"1px solid #7c3aed"}},sw.babyId):null));
      nameBlock.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",marginTop:"1px"}},sw.parent+(sw.contact?" · "+sw.contact:"")));
      hdr.appendChild(nameBlock);
      hdr.appendChild(el("span",{style:{fontSize:"9px",background:"#0f2a4a",color:"#60a5fa",borderRadius:"4px",padding:"2px 7px",border:"1px solid #1e3a5f"}},(sw.packages.length)+" course"+(sw.packages.length!==1?"s":"")));
      hdr.appendChild(el("span",{style:{fontSize:"10px",color:"var(--text3)"}},(totalSessions)+" sessions"));
      hdr.appendChild(el("span",{style:{fontSize:"10px",color:"#334155"}},isExpanded?"▲":"▼"));
      block.appendChild(hdr);
      if(isExpanded){
        // Move to Active button
        const compReg=state.registrations.find(r=>r.swimmerName===sw.name&&r.active===false);
        const moveBar=el("div",{style:{padding:"6px 14px",background:"#061220",borderTop:"1px solid #0d1a2a",display:"flex",justifyContent:"flex-end"}});
        moveBar.appendChild(el("button",{onClick:()=>{if(compReg){compReg.active=true;}render();},style:{padding:"3px 10px",borderRadius:"5px",border:"1px solid #166534",background:"#052e16",color:"#4ade80",fontSize:"9px",cursor:"pointer"}},"↩ Move to Active"));
        block.appendChild(moveBar);
        (sw.packages||[]).forEach((pkg,pi)=>{
          const p=PKG_TYPES[pkg.type]||PKG_TYPES.group;
          const sorted=(pkg.sessions||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
          const pkgRow=el("div",{style:{padding:"8px 14px 8px 28px",background:si%2===0?"#091929":"#07141f",borderTop:"1px solid #0d1a2a"}});
          const pkgHdr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",marginBottom:sorted.length?"6px":"0"}});
          pkgHdr.appendChild(el("span",{style:{fontSize:"9px",color:"var(--text3)",fontWeight:600}},"#"+(pi+1)));
          pkgHdr.appendChild(el("span",{style:{fontSize:"9px",background:p.bg,color:p.color,borderRadius:"4px",padding:"2px 7px",border:`1px solid ${p.border}`,fontWeight:700}},p.label));
          if(pkg.startedAt)pkgHdr.appendChild(el("span",{style:{fontSize:"9px",color:"#475569"}},new Date(pkg.startedAt+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})));
          pkgHdr.appendChild(el("span",{style:{fontSize:"10px",color:"#4ade80",fontWeight:700}},sorted.length+"/"+pkg.totalClasses+" ✓"));
          pkgRow.appendChild(pkgHdr);
          if(sorted.length){
            const grid=el("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap"}});
            sorted.forEach((s,idx)=>{
              const d=new Date(s.date+"T00:00:00");
              grid.appendChild(el("div",{style:{background:"#061220",border:"1px solid #1e3a5f",borderRadius:"6px",padding:"4px 8px",fontSize:"9px",color:"#60a5fa",textAlign:"center",minWidth:"44px"}},
                el("div",{style:{fontWeight:700,fontSize:"10px",color:"#93c5fd"}},idx+1),
                el("div",null,d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})),
                el("div",{style:{color:"#475569",fontSize:"8px"}},d.toLocaleDateString("en-GB",{weekday:"short"}))));
            });
            pkgRow.appendChild(grid);
          }
          block.appendChild(pkgRow);
        });
      }
      tbl.appendChild(block);
    });
    wrap.appendChild(tbl);
    return wrap;
  }

  // ── ACTIVE TAB ──
  const swimmerMap={};
  state.registrations.forEach(reg=>{
    if(reg.active===false)return;
    // Find swimmer by name match or parent name match
    const sw=state.swimmers.find(s=>s.name===reg.swimmerName)
           ||state.swimmers.find(s=>s.parentName===reg.swimmerName)
           ||state.swimmers.find(s=>s.parentName===reg.parentName);
    // Key by Baby ID if available, else by swimmerName
    const key=sw?.babyId||reg.swimmerName.toLowerCase();
    const childName=sw?.name||reg.swimmerName;
    const parent=sw?.parentName||reg.parentName||reg.swimmerName;
    const babyId=sw?.babyId||"";
    const contact=sw?.contactNumber||reg.contactNumber||"";

    if(!swimmerMap[key]){
      swimmerMap[key]={name:childName,parent,babyId,contact,sw,packages:[]};
    }
    (reg.packages||[]).forEach(pkg=>{
      if(pkg.type==="tryout")return;
      swimmerMap[key].packages.push(pkg);
    });
  });

  // Sort each swimmer's packages by startedAt
  Object.values(swimmerMap).forEach(s=>{
    (s.packages||[]).sort((a,b)=>(a.startedAt||"").localeCompare(b.startedAt||""));
  });

  // Filter by search
  const swimmers=Object.values(swimmerMap).filter(s=>{
    if(!q)return true;
    return s.name.toLowerCase().includes(q)||s.parent.toLowerCase().includes(q)||s.babyId.toLowerCase().includes(q);
  });

  // Group by assigned class slot, unassigned at end
  const dayOrder={Monday:0,Tuesday:1,Wednesday:2,Thursday:3,Friday:4,Saturday:5,Sunday:6};
  const classGroups={};
  const unassigned=[];
  swimmers.forEach(sw=>{
    const assignedCls=Object.values(state.weeklyClasses).flat().find(c=>c.students.some(s=>s.name===sw.name));
    if(assignedCls){
      const key=assignedCls.day+"|"+assignedCls.time;
      if(!classGroups[key])classGroups[key]={label:assignedCls.day+" · "+assignedCls.time,day:assignedCls.day,time:assignedCls.time,swimmers:[]};
      classGroups[key].swimmers.push(sw);
    } else {
      unassigned.push(sw);
    }
  });
  const sortedGroups=Object.values(classGroups).sort((a,b)=>(dayOrder[a.day]??7)-(dayOrder[b.day]??7)||(a.time||"").localeCompare(b.time||""));
  if(unassigned.length)sortedGroups.push({label:"📋 Unassigned",swimmers:unassigned});

  if(!sortedGroups.length){
    wrap.appendChild(el("div",{style:{textAlign:"center",padding:"40px",color:"var(--text3)",border:"1px dashed #1e3a5f",borderRadius:"10px"}},"No records found."));
    return wrap;
  }

  wrap.appendChild(el("div",{style:{fontSize:"10px",color:"var(--text3)",marginBottom:"8px"}},swimmers.length+" swimmers"));

  const DAY_COLORS={Monday:"#fbbf24",Tuesday:"#f472b6",Wednesday:"#4ade80",Thursday:"#fb923c",Friday:"#60a5fa",Saturday:"#c084fc",Sunday:"#f87171"};

  sortedGroups.forEach(group=>{
    const dayColor=DAY_COLORS[group.day]||"#60a5fa";
    wrap.appendChild(el("div",{style:{fontSize:"11px",fontWeight:700,color:dayColor,margin:"16px 0 6px",display:"flex",alignItems:"center",gap:"8px",borderLeft:"3px solid "+dayColor,paddingLeft:"8px"}},
      el("span",null,"📅 "+group.label),
      el("span",{style:{fontSize:"9px",color:"var(--text3)",fontWeight:400}},group.swimmers.length+" swimmer"+(group.swimmers.length!==1?"s":""))));

    const tbl=el("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderLeft:"2px solid "+dayColor,borderRadius:"0 12px 12px 0",overflow:"hidden",marginBottom:"8px"}});

    group.swimmers.forEach((sw,si)=>{
    const isExpanded=!!state.regShowHistory["sw_"+sw.name];
    const totalSessions=(sw.packages||[]).reduce((s,p)=>s+(p.sessions?.length||0),0);
    const totalClasses=(sw.packages||[]).reduce((s,p)=>s+p.totalClasses,0);

    const block=el("div",{style:{borderBottom:si<swimmers.length-1?"1px solid #0d1a2a":"none"}});

    // Swimmer header row
    const hdr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",padding:"10px 14px",background:si%2===0?"#0d1f33":"#0a1624",cursor:"pointer"},
      onClick:()=>{state.regShowHistory={...state.regShowHistory,["sw_"+sw.name]:!isExpanded};render();}});

    // Name + baby ID
    const nameBlock=el("div",{style:{flex:1,minWidth:"120px"}});
    nameBlock.appendChild(el("div",{style:{fontSize:"11px",fontWeight:700,color:"var(--text)",display:"flex",alignItems:"center",gap:"6px"}},
      sw.name,
      sw.babyId?el("span",{style:{fontSize:"9px",color:"#c084fc",fontFamily:"monospace",background:"#1a0a2e",borderRadius:"3px",padding:"1px 5px",border:"1px solid #7c3aed"}},sw.babyId):null));
    nameBlock.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",marginTop:"1px"}},sw.parent+(sw.contact?" · "+sw.contact:"")));
    hdr.appendChild(nameBlock);

    // Package count badge
    hdr.appendChild(el("span",{style:{fontSize:"9px",background:"#0f2a4a",color:"#60a5fa",borderRadius:"4px",padding:"2px 7px",border:"1px solid #1e3a5f",fontWeight:600,flexShrink:0}},sw.packages.length+" course"+(sw.packages.length!==1?"s":"")));

    // Total sessions
    hdr.appendChild(el("span",{style:{fontSize:"10px",fontWeight:700,color:"var(--text3)",flexShrink:0}},totalSessions+" sessions"));
    hdr.appendChild(el("span",{style:{fontSize:"10px",color:"#334155"}},isExpanded?"▲":"▼"));
    block.appendChild(hdr);

    // Expanded — show each package as a row
    if(isExpanded){
      const editKey="edit_"+sw.name;
      const isEditing=!!state.regShowHistory[editKey];
      const reg=state.registrations.find(r=>r.swimmerName===sw.name);

      // Info / edit bar
      const infoBar=el("div",{style:{padding:"8px 14px",background:"#061220",borderTop:"1px solid #0d1a2a",display:"flex",gap:"8px",flexWrap:"wrap",alignItems:"center"}});
      infoBar.appendChild(el("span",{style:{fontSize:"10px",color:"var(--text3)",flex:1}},"👤 "+sw.parent+(sw.contact?" · "+sw.contact:"")));
      infoBar.appendChild(el("button",{onClick:()=>{state.regShowHistory={...state.regShowHistory,[editKey]:!isEditing};render();},style:{padding:"2px 8px",borderRadius:"5px",border:"1px solid",fontSize:"9px",cursor:"pointer",borderColor:isEditing?"#166534":"#334155",background:isEditing?"#052e16":"#0a1628",color:isEditing?"#4ade80":"#64748b"}},isEditing?"✓ Done":"✏️ Edit"));
      block.appendChild(infoBar);

      (sw.packages||[]).forEach((pkg,pi)=>{
        const p=PKG_TYPES[pkg.type]||PKG_TYPES.group;
        const sorted=(pkg.sessions||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
        const sessCount=sorted.length;
        const over=Math.max(0,sessCount-pkg.totalClasses);
        const pkgKey="pkg_"+pkg.id;
        const pkgExpanded=!!state.regShowHistory[pkgKey];

        const pkgRow=el("div",{style:{padding:"8px 14px 8px 28px",background:si%2===0?"#091929":"#07141f",borderTop:"1px solid #0d1a2a"}});
        const pkgHdr=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap",cursor:"pointer"},
          onClick:()=>{state.regShowHistory={...state.regShowHistory,[pkgKey]:!pkgExpanded};render();}});

        pkgHdr.appendChild(el("span",{style:{fontSize:"9px",color:"var(--text3)",fontWeight:600,minWidth:"20px"}},"#"+(pi+1)));

        if(isEditing){
          const typeBtn=el("select",{style:{fontSize:"9px",background:p.bg,color:p.color,border:"1px solid "+p.border,borderRadius:"4px",padding:"2px 4px",cursor:"pointer"},onClick:e=>e.stopPropagation()});
          Object.entries(PKG_TYPES).filter(([k])=>k!=="tryout").forEach(([k,pt])=>{const opt=el("option",{value:k},pt.label);if(k===pkg.type)opt.selected=true;typeBtn.appendChild(opt);});
          typeBtn.addEventListener("change",e=>{state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).map(p2=>p2.id!==pkg.id?p2:{...p2,type:e.target.value})}));render();});
          pkgHdr.appendChild(typeBtn);
        } else {
          pkgHdr.appendChild(el("span",{style:{fontSize:"9px",background:p.bg,color:p.color,borderRadius:"4px",padding:"2px 7px",border:"1px solid "+p.border,fontWeight:700,flexShrink:0}},p.label));
        }

        if(pkg.startedAt)pkgHdr.appendChild(el("span",{style:{fontSize:"9px",color:"#475569"}},new Date(pkg.startedAt+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"2-digit"})));

        const dotsWrap=el("div",{style:{display:"flex",gap:"2px",flexWrap:"wrap",flexShrink:0}});
        for(let s=0;s<Math.max(sessCount,pkg.totalClasses);s++){const isOver=s>=pkg.totalClasses;const filled=s<sessCount;dotsWrap.appendChild(el("div",{style:{width:"9px",height:"9px",borderRadius:"2px",background:filled?(isOver?"#d97706":"#2563eb"):"#1e3a5f",border:filled?(isOver?"1px solid #f59e0b":"1px solid #3b82f6"):"1px solid #334155"}}));}
        pkgHdr.appendChild(dotsWrap);
        pkgHdr.appendChild(el("span",{style:{fontSize:"10px",fontWeight:700,flexShrink:0,color:over>0?"#f59e0b":sessCount>=pkg.totalClasses?"#4ade80":"var(--text3)"}},sessCount+"/"+pkg.totalClasses+(over>0?" +"+over:sessCount>=pkg.totalClasses?" ✓":"")));

        if(isEditing){
          const adjRow=el("div",{style:{display:"flex",gap:"3px",alignItems:"center",marginLeft:"auto"},onClick:e=>e.stopPropagation()});
          adjRow.appendChild(el("button",{onClick:()=>{state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).map(p2=>p2.id!==pkg.id?p2:{...p2,totalClasses:Math.max(1,p2.totalClasses-1)})}));render();},style:{padding:"1px 6px",borderRadius:"4px",border:"1px solid #334155",background:"#0a1628",color:"#64748b",fontSize:"10px",cursor:"pointer"}},"-"));
          adjRow.appendChild(el("span",{style:{fontSize:"9px",color:"var(--text3)",minWidth:"16px",textAlign:"center"}},pkg.totalClasses));
          adjRow.appendChild(el("button",{onClick:()=>{state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).map(p2=>p2.id!==pkg.id?p2:{...p2,totalClasses:p2.totalClasses+1})}));render();},style:{padding:"1px 6px",borderRadius:"4px",border:"1px solid #334155",background:"#0a1628",color:"#64748b",fontSize:"10px",cursor:"pointer"}},"+"));
          pkgHdr.appendChild(adjRow);
          pkgHdr.appendChild(el("button",{onClick:e=>{e.stopPropagation();if(!confirm("Delete this course?"))return;state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).filter(p2=>p2.id!==pkg.id)}));render();},style:{padding:"1px 6px",borderRadius:"4px",border:"1px solid #7f1d1d",background:"#450a0a",color:"#f87171",fontSize:"9px",cursor:"pointer"}},"🗑"));
        } else {
          pkgHdr.appendChild(el("div",{style:{marginLeft:"auto"}}));
        }

        pkgHdr.appendChild(el("span",{style:{fontSize:"9px",color:"#334155"}},pkgExpanded?"▲":"▼"));
        pkgRow.appendChild(pkgHdr);

        if(pkgExpanded){
          const grid=el("div",{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginTop:"8px"}});
          sorted.forEach((s,idx)=>{
            const d=new Date(s.date+"T00:00:00");
            const isExtra=idx>=pkg.totalClasses;
            const tile=el("div",{style:{background:isExtra?"#1c1100":"#061220",border:isExtra?"1px solid #92400e":"1px solid #1e3a5f",borderRadius:"6px",padding:"4px 6px",fontSize:"9px",textAlign:"center",minWidth:"44px",position:"relative"}});
            tile.appendChild(el("div",{style:{fontWeight:700,fontSize:"10px",color:isExtra?"#f59e0b":"#93c5fd"}},idx+1+(isExtra?" ✚":"")));
            if(isEditing){
              const dBtn=el("button",{onClick:e=>{e.stopPropagation();state.regDateModal={sessId:s.id,pkgId:pkg.id,date:s.date};render();},style:{display:"block",fontSize:"9px",background:"transparent",border:"none",color:isExtra?"#fbbf24":"#60a5fa",cursor:"pointer",padding:"2px 0",textDecoration:"underline dotted"}},d.toLocaleDateString("en-GB",{day:"numeric",month:"short"}));
              tile.appendChild(dBtn);
              const delBtn=document.createElement("button");
              delBtn.textContent="×";
              delBtn.style.cssText="position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;border:none;background:#7f1d1d;color:#fca5a5;font-size:9px;cursor:pointer;line-height:14px;text-align:center;padding:0";
              delBtn.addEventListener("click",e=>{e.stopPropagation();state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).map(p2=>p2.id!==pkg.id?p2:{...p2,sessions:(p2.sessions||[]).filter(ss=>ss.id!==s.id)})}));render();});
              tile.appendChild(delBtn);
            } else {
              tile.appendChild(el("div",{style:{color:isExtra?"#fbbf24":"#60a5fa"}},d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})));
              tile.appendChild(el("div",{style:{color:"#475569",fontSize:"8px"}},d.toLocaleDateString("en-GB",{weekday:"short"})));
            }
            grid.appendChild(tile);
          });
          if(isEditing){
            const addSessBtn=el("button",{onClick:e=>{e.stopPropagation();const ns={id:Date.now(),date:isoDate(new Date()),status:"attended",counted:true,note:""};state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).map(p2=>p2.id!==pkg.id?p2:{...p2,sessions:[...(p2.sessions||[]),ns]})}));render();},style:{width:"44px",minHeight:"52px",borderRadius:"6px",border:"1px dashed #2563eb",background:"#0a1628",color:"#60a5fa",fontSize:"18px",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}},"+");
            grid.appendChild(addSessBtn);
          }
          pkgRow.appendChild(grid);
        }
        block.appendChild(pkgRow);
      });

      // Edit mode footer
      if(isEditing){
        const editFooter=el("div",{style:{padding:"8px 14px",background:"#061220",borderTop:"1px solid #0d1a2a",display:"flex",gap:"6px",flexWrap:"wrap"}});
        editFooter.appendChild(el("button",{onClick:()=>{if(!reg)return;const np={id:Date.now(),type:(reg.packages||[])[0]?.type||"group",totalClasses:8,sessions:[],active:true,startedAt:isoDate(new Date()),payment:0,contactNumber:reg.contactNumber||""};if(!reg.packages)reg.packages=[];reg.packages.forEach(p=>p.active=false);reg.packages.push(np);render();},style:{padding:"3px 10px",borderRadius:"5px",border:"1px solid #2563eb",background:"#0f2a4a",color:"#60a5fa",fontSize:"9px",cursor:"pointer"}},"➕ Add Course"));
        editFooter.appendChild(el("button",{onClick:()=>{if(reg){reg.active=!reg.active;}render();},style:{padding:"3px 10px",borderRadius:"5px",border:"1px solid",fontSize:"9px",cursor:"pointer",borderColor:reg?.active===false?"#166534":"#7f1d1d",background:reg?.active===false?"#052e16":"#450a0a",color:reg?.active===false?"#4ade80":"#f87171"}},reg?.active===false?"↩ Move to Active":"→ Move to Complete"));
        block.appendChild(editFooter);
      }
    }

    tbl.appendChild(block);
    }); // end group.swimmers.forEach

    wrap.appendChild(tbl);
  }); // end sortedGroups.forEach

  return wrap;
}
// ── Sales view ─────────────────────────────────────────────────
function buildSalesView(){
  const wrap=el("div",null);
  const now=new Date();
  const baseY=now.getFullYear();

  // Tabs
  const tabs=[
    {id:"transactions",label:"💳 Transactions"},
    {id:"thismonth",label:"📅 This Month"},
    {id:"thisyear",label:"📈 This Year"},
  ];
  const tabBar=el("div",{style:{display:"flex",gap:"4px",marginBottom:"18px",borderBottom:"2px solid #1e3a5f"}});
  tabs.forEach(t=>{
    const active=state.salesTab===t.id;
    tabBar.appendChild(el("button",{onClick:()=>{state.salesTab=t.id;render();},style:{padding:"8px 16px",borderRadius:"8px 8px 0 0",border:"1px solid",fontSize:"12px",fontWeight:700,cursor:"pointer",borderColor:active?"#2563eb":"#1e3a5f",background:active?"#0f2a4a":"#0a1628",color:active?"#60a5fa":"#64748b",borderBottom:active?"2px solid #0f2a4a":"none",marginBottom:active?"-2px":"0"}},t.label));
  });
  wrap.appendChild(tabBar);

  // ══ TRANSACTIONS ══
  if(state.salesTab==="transactions"){
    // Month filter
    const filterRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"14px",alignItems:"center",flexWrap:"wrap"}});
    const mSel=el("select",{className:"iS",style:{fontSize:"12px"}});
    mSel.appendChild(el("option",{value:"all"},"All months"));
    for(let y=baseY;y>=baseY-2;y--){
      for(let m=11;m>=0;m--){
        if(y===baseY&&m>now.getMonth())continue;

    list.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"10px 14px",borderBottom:"1px solid var(--border)",background:i%2===0?"#0d1f33":"#0a1624",flexWrap:"wrap",opacity:"0.8"}},
      el("div",{style:{width:"22px",height:"22px",borderRadius:"50%",background:"#171717",border:"1px solid #404040",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",fontWeight:700,color:"var(--text3)"}},s.name.charAt(0)),
        el("div",{style:{flex:1,minWidth:"80px"}},
        el("div",{style:{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}},
          el("div",{style:{fontSize:"11px",color:"var(--text2)",fontWeight:500}},s.name),
          s.babyId?el("span",{style:{fontSize:"9px",background:"#1a0a2e",color:"#c084fc",borderRadius:"4px",padding:"1px 6px",border:"1px solid #7c3aed",fontWeight:700,fontFamily:"monospace"}},s.babyId):null),
        el("div",{style:{fontSize:"9px",color:"var(--text3)"}},(s.parentName?s.parentName+" · ":"")+displayAge(s)+" · "+sc.emoji+" "+a2l(s.dob||s.age)+(s.memberId?" · Member: "+s.memberId:""))),
      (!isCoach?el("button",{onClick:()=>{state.swimmers=state.swimmers.map(x=>x.id!==s.id?x:{...x,active:true});render();},style:{padding:"4px 12px",borderRadius:"6px",border:"1px solid #166534",fontSize:"10px",fontWeight:600,background:"#052e16",color:"#4ade80",cursor:"pointer"}},"✓ Reactivate"):null),
      (!isCoach?el("button",{onClick:()=>{if(!confirm("Permanently delete "+s.name+"?"))return;state.swimmers=state.swimmers.filter(x=>x.id!==s.id);render();},style:{padding:"4px 9px",borderRadius:"6px",border:"1px solid #7f1d1d",fontSize:"10px",background:"#450a0a",color:"#f87171",cursor:"pointer"}},"🗑 Delete"):null)));
  });
  wrap.appendChild(list);
  return wrap;
}

// ── App root ───────────────────────────────────────────────────
function buildApp(){
  if(!state.currentUser)return buildLoginScreen();
  const app=el("div",{style:{fontFamily:"var(--font)",height:"100vh",background:"var(--bg)",color:"var(--text)",display:"flex",overflow:"hidden"}});
  const addModal=buildAddModal();if(addModal)app.appendChild(addModal);
  const confirmAddModal=buildConfirmAddModal();if(confirmAddModal)app.appendChild(confirmAddModal);
  const convertModal=buildConvertModal();if(convertModal)app.appendChild(convertModal);
  const shareModal=buildShareModal();if(shareModal)app.appendChild(shareModal);
  const pkgConfirm=buildPkgTypeConfirmModal();if(pkgConfirm)app.appendChild(pkgConfirm);
  const addUserModal=buildAddUserModal();if(addUserModal)app.appendChild(addUserModal);
  const poolClosureModal=buildPoolClosureModal();if(poolClosureModal)app.appendChild(poolClosureModal);

  // Date picker modal for register
  if(state.regDateModal){
    const dm=state.regDateModal;
    const overlay=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget){state.regDateModal=null;render();}}});
    const modal=el("div",{className:"modal modal-sm"});
    modal.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},
      el("h2",{style:{fontSize:"15px",color:"var(--text)",fontWeight:700}},"📅 Change Date"),
      el("button",{onClick:()=>{state.regDateModal=null;render();},style:{background:"var(--surface2)",border:"none",color:"var(--text2)",borderRadius:"6px",padding:"4px 10px",fontSize:"13px"}},"✕")));
    const dateInp=el("input",{type:"date",value:dm.date,className:"iS",style:{fontSize:"16px",marginBottom:"16px",width:"100%",textAlign:"center"}});
    modal.appendChild(dateInp);
    modal.appendChild(el("button",{onClick:()=>{
      const newDate=dateInp.value;
      if(!newDate)return;
      state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).map(p=>p.id!==dm.pkgId?p:{...p,sessions:(p.sessions||[]).map(s=>s.id!==dm.sessId?s:{...s,date:newDate})})}));
      state.regDateModal=null;render();
    },style:{width:"100%",padding:"12px",borderRadius:"8px",border:"none",fontSize:"14px",fontWeight:700,background:"#2563eb",color:"#fff",cursor:"pointer"}},"✓ Confirm"));
    overlay.appendChild(modal);
    app.appendChild(overlay);
  }
  const addCoachModal=buildAddCoachModal();if(addCoachModal)app.appendChild(addCoachModal);
  const addClassTypeModal=buildAddClassTypeModal();if(addClassTypeModal)app.appendChild(addClassTypeModal);
  const newSaleModal=buildNewSaleModal();if(newSaleModal)app.appendChild(newSaleModal);
  const deleteConfirmModal=buildDeleteConfirmModal();if(deleteConfirmModal)app.appendChild(deleteConfirmModal);
  const xferModal=buildXferModal();if(xferModal)app.appendChild(xferModal);
  const addClassModal=buildAddClassModal();if(addClassModal)app.appendChild(addClassModal);
  const regModal=buildRegisterModal();if(regModal)app.appendChild(regModal);

  // Sidebar (hidden on mobile via CSS)
  const sidebarEl=buildSidebar();
  sidebarEl.classList.add("sidebar-desktop");
  app.appendChild(sidebarEl);

  const main=el("div",{className:"main-scroll vh100",style:{flex:1,display:"flex",flexDirection:"column",overflowY:"auto",background:"var(--bg)"}});
  main.appendChild(buildTopBar());
  const content=el("div",{className:"main-content",style:{padding:"24px 28px",flex:1,maxWidth:"1000px",width:"100%",margin:"0 auto"}});
  if(state.view==="schedule")content.appendChild(buildScheduleView());
  else if(state.view==="coach")content.appendChild(buildCoachView());
  else if(state.view==="admin")content.appendChild(buildAdminView());
  else if(state.view==="swimmers")content.appendChild(buildSwimmersView());
  else if(state.view==="register")content.appendChild(buildRegisterView());
  else if(state.view==="profile")content.appendChild(buildProfileView());
  else if(state.view==="manageusers")content.appendChild(buildManageUsersView());
  else if(state.view==="sales")content.appendChild(buildSalesView());
  main.appendChild(content);
  app.appendChild(main);

  // Mobile bottom nav
  const isAdmin=state.currentUser?.role==="admin";
  const isCoach=state.currentUser?.role==="coach";
  const isGuest=state.currentUser?.role==="guest";
  const mobileNav=el("div",{className:"mobile-nav"});
  const mobileNavItems=isGuest?[
    {v:"schedule",icon:"📅",label:"Schedule"},
  ]:isCoach?[
    {v:"schedule",icon:"📅",label:"Schedule"},
    {v:"swimmers",icon:"🏊",label:"Swimmers"},
    {v:"register",icon:"📝",label:"Register"},
  ]:[
    {v:"schedule",icon:"📅",label:"Schedule"},
    {v:"admin",icon:"📋",label:"Classes"},
    {v:"swimmers",icon:"🏊",label:"Swimmers"},
    {v:"register",icon:"📝",label:"Register"},
    {v:"sales",icon:"📊",label:"Sales"},
    {v:"manageusers",icon:"⚙️",label:"More"},
  ];
  mobileNavItems.forEach(({v,icon,label})=>{
    const btn=el("button",{onClick:()=>{state.view=v;render();},className:state.view===v?"active":""});
    btn.appendChild(el("span",{className:"icon"},icon));
    btn.appendChild(el("span",{className:"label"},label));
    mobileNav.appendChild(btn);
  });
  app.appendChild(mobileNav);

  return app;
}
render();
</script>

<style>
#install-banner{
  display:none;position:fixed;bottom:80px;left:12px;right:12px;
  background:var(--surface);border:1px solid var(--border2);border-radius:14px;
  padding:14px 16px;z-index:9998;box-shadow:0 8px 32px rgba(0,0,0,0.4);
  align-items:center;gap:12px;animation:slideUp 0.3s ease;
}
#install-banner.show{display:flex;}
#install-banner .ib-icon{font-size:28px;flex-shrink:0;}
#install-banner .ib-text{flex:1;}
#install-banner .ib-title{font-size:13px;font-weight:700;color:var(--text);font-family:var(--font);}
#install-banner .ib-sub{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--font);}
#install-banner .ib-btn{padding:8px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;}
#install-banner .ib-dismiss{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
</style>

<div id="install-banner">
  <span class="ib-icon">🏊</span>
  <div class="ib-text">
    <div class="ib-title">Install RBSC Swim</div>
    <div class="ib-sub">Add to home screen for quick access</div>
  </div>
  <button class="ib-btn" id="install-btn">Install</button>
  <button class="ib-dismiss" id="install-dismiss">✕</button>
</div>

<script>
let _installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();_installPrompt=e;
  setTimeout(()=>{const b=document.getElementById('install-banner');if(b&&!localStorage.getItem('pwa-dismissed'))b.classList.add('show');},2500);
});
const ib=document.getElementById('install-btn');
if(ib)ib.addEventListener('click',async()=>{
  document.getElementById('install-banner').classList.remove('show');
  if(_installPrompt){await _installPrompt.prompt();_installPrompt=null;}
});
const id=document.getElementById('install-dismiss');
if(id)id.addEventListener('click',()=>{
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('pwa-dismissed','1');
});
window.addEventListener('appinstalled',()=>{document.getElementById('install-banner').classList.remove('show');_installPrompt=null;});

// iOS Safari hint
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true;
if(isIOS&&!isStandalone&&!localStorage.getItem('pwa-dismissed')){
  setTimeout(()=>{
    const b=document.getElementById('install-banner');if(!b)return;
    b.querySelector('.ib-sub').textContent='Tap the Share button → "Add to Home Screen"';
    const btn=b.querySelector('#install-btn');if(btn)btn.style.display='none';
    b.classList.add('show');
  },2500);
}
</script>
</body>
</html>
