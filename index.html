      const lRow=el("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:"4px"}});
      lRow.appendChild(el("span",{style:{fontSize:"11px",color:"var(--text)"}},l));
      lRow.appendChild(el("span",{style:{fontSize:"11px",color:c,fontWeight:700}},"฿"+v.toLocaleString()+" · "+pct+"%"));
      row.appendChild(lRow);
      const barBg=el("div",{style:{height:"6px",background:"var(--border)",borderRadius:"3px",overflow:"hidden"}});
      barBg.appendChild(el("div",{style:{height:"100%",width:pct+"%",background:c,borderRadius:"3px"}}));
      row.appendChild(barBg);
      ybCard.appendChild(row);
    });
    wrap.appendChild(ybCard);

    // Monthly bar chart
    wrap.appendChild(el("div",{style:{fontSize:"10px",color:"var(--text3)",textTransform:"uppercase",marginBottom:"8px",fontWeight:700}},"Monthly — tap to see details"));
    const maxIncome=Math.max(...monthlyData.map(d=>d.income),1);
    const chartH=100;
    const chartArea=el("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"10px",padding:"14px",marginBottom:"12px"}});
    const bars=el("div",{style:{display:"flex",alignItems:"flex-end",gap:"4px",height:chartH+"px"}});
    monthlyData.forEach(d=>{
      const isCur=d.m===now.getMonth()&&yr===now.getFullYear();
      const isSelected=state.dashMonth===d.m;
      const barH=d.income>0?Math.max(4,Math.round(d.income/maxIncome*(chartH-16))):2;
      const col=el("div",{style:{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:"2px",cursor:"pointer",height:"100%",justifyContent:"flex-end"},
        onClick:()=>{state.dashMonth=state.dashMonth===d.m?null:d.m;render();}});
      const bar=el("div",{style:{width:"100%",borderRadius:"3px 3px 0 0",background:isSelected?"#2563eb":isCur?"#0ea5e9":"var(--border)",height:barH+"px",transition:"all 0.15s",border:isSelected?"1px solid #60a5fa":"1px solid transparent"}});
      col.appendChild(bar);
      col.appendChild(el("div",{style:{fontSize:"7px",color:isCur?"#60a5fa":isSelected?"#93c5fd":"#475569",fontWeight:isCur||isSelected?700:400}},d.name));
      bars.appendChild(col);
    });
    chartArea.appendChild(bars);
    wrap.appendChild(chartArea);

    // Selected month drill-down
    if(state.dashMonth!=null){
      const dm=state.dashMonth;
      const dp=calcMonthlyProfit(yr,dm);
      const dIncome=dp.breakdown.private+dp.breakdown.group+dp.breakdown.dropin;
      const drill=el("div",{style:{background:"var(--surface)",border:"1px solid #2563eb",borderRadius:"10px",padding:"14px"}});
      drill.appendChild(el("div",{style:{fontSize:"12px",fontWeight:700,color:"#60a5fa",marginBottom:"12px"}},MONTHS[dm]+" "+yr+" — Breakdown"));
      const dGrid=el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"8px",marginBottom:"12px"}});
      [{l:"🟣 Private",v:dp.breakdown.private,c:"#e879f9"},{l:"🔵 Group",v:dp.breakdown.group,c:"#38bdf8"},{l:"🟡 Drop In",v:dp.breakdown.dropin,c:"#fbbf24"},{l:"Total Income",v:dIncome,c:"#f59e0b"},{l:"Expense",v:dp.totalSalary,c:"#f87171"},{l:"Profit",v:dp.profit,c:dp.profit>=0?"#4ade80":"#f87171"}].forEach(({l,v,c})=>{
        dGrid.appendChild(el("div",{style:{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"8px",padding:"8px",textAlign:"center"}},
          el("div",{style:{fontSize:"14px",fontWeight:700,color:c}},"฿"+v.toLocaleString()),
          el("div",{style:{fontSize:"8px",color:"var(--text3)",textTransform:"uppercase",marginTop:"2px"}},l)));
      });
      drill.appendChild(dGrid);
      // Coach breakdown for selected month
      state.coaches.forEach(ch=>{
        const sal=calcCoachSalary(ch,yr,dm);
        if(!sal.total)return;
        drill.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",padding:"6px 0",borderTop:"1px solid var(--border)",fontSize:"11px"}},
          el("span",{style:{color:"var(--text)"}},ch.name+" · "+sal.slots+" classes"),
          el("span",{style:{color:"#f87171",fontWeight:600}},"฿"+sal.total.toLocaleString())));
      });
      wrap.appendChild(drill);
    }
    return wrap;
  }

  return wrap;
}

function buildInactiveContent(isCoach){
  const wrap=el("div",null);
  const inactive=state.swimmers.filter(s=>s.active===false);
  wrap.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"8px"}},
    el("div",null,
      el("h2",{style:{fontSize:"14px",color:"var(--text)",fontWeight:700,marginBottom:"3px"}},"🚫 Inactive Swimmers"),
      el("p",{style:{fontSize:"11px",color:"var(--text3)"}},inactive.length+" swimmer"+(inactive.length!==1?"s":"")+" inactive"))));
  if(inactive.length===0){
    wrap.appendChild(el("div",{style:{textAlign:"center",padding:"40px 16px",color:"var(--text3)",fontSize:"12px",border:"1px dashed var(--border)",borderRadius:"10px"}},
      el("div",{style:{fontSize:"28px",marginBottom:"8px"}},"✅"),"No inactive swimmers."));
    return wrap;
  }

  const list=el("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}});

  inactive.forEach((s,i)=>{
    const sc=LC[a2l(s.dob||s.age)]||LC["Baby"];
    const isExp=!!state["inactExp_"+s.id];

    // Course history
    const history=s.courseHistory||[];
    const lastCourse=history.length?history[history.length-1]:s.currentCourse||null;
    const totalSessions=history.reduce((sum,c)=>(sum+(c.history||[]).filter(h=>h.status==="attended").length),0)
      +(s.currentCourse?(s.currentCourse.history||[]).filter(h=>h.status==="attended").length:0);
    const totalCourses=history.length+(s.currentCourse?1:0);

    // Attendance pattern from all history entries
    const allAttendance=[...history,...(s.currentCourse?[s.currentCourse]:[])].flatMap(c=>c.history||[]);
    // Days of week they typically came
    const dayCounts={};
    allAttendance.filter(h=>h.status==="attended").forEach(h=>{
      if(!h.date)return;
      const day=new Date(h.date+"T00:00:00").toLocaleDateString("en-GB",{weekday:"long"});
      dayCounts[day]=(dayCounts[day]||0)+1;
    });
    const topDays=Object.entries(dayCounts).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([d,n])=>d+" ("+n+"x)");

    const card=el("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"10px",overflow:"hidden",opacity:"0.85"}});

    // Header row — always visible
    const hdr=el("div",{
      style:{display:"flex",alignItems:"center",gap:"10px",padding:"10px 14px",cursor:"pointer",background:i%2===0?"var(--surface)":"var(--surface2)"},
      onClick:()=>{state["inactExp_"+s.id]=!isExp;render();}
    });

    // Avatar
    hdr.appendChild(el("div",{style:{width:"28px",height:"28px",borderRadius:"50%",background:"#171717",border:"1px solid #404040",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",fontWeight:700,color:"#475569",flexShrink:0}},s.name.charAt(0)));

    // Name + meta
    const meta=el("div",{style:{flex:1,minWidth:0}});
    meta.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}},
      el("span",{style:{fontSize:"11px",color:"var(--text2)",fontWeight:600}},s.name),
      s.babyId?el("span",{style:{fontSize:"9px",background:state.theme==="dark"?"#2e0a3a":"#f3e8ff",color:state.theme==="dark"?"#c084fc":"#9333ea",borderRadius:"4px",padding:"1px 5px",border:"1px solid #7c3aed",fontFamily:"monospace"}},s.babyId):null));
    meta.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",marginTop:"2px"}},
      (s.parentName?s.parentName+" · ":"")+displayAge(s)+" · "+sc.emoji+" "+a2l(s.dob||s.age)));
    hdr.appendChild(meta);

    // Quick summary badges
    const badges=el("div",{style:{display:"flex",gap:"4px",flexShrink:0,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}});
    if(totalCourses>0){
      badges.appendChild(el("span",{style:{fontSize:"9px",background:state.theme==="dark"?"#052e16":"#dcfce7",color:state.theme==="dark"?"#4ade80":"#15803d",borderRadius:"4px",padding:"2px 6px",border:"1px solid #86efac"}},
        totalSessions+" sessions"));
    }
    hdr.appendChild(badges);
    if(!isCoach){
      hdr.appendChild(el("button",{onClick:e=>{e.stopPropagation();state.swimmers=state.swimmers.map(x=>x.id!==s.id?x:{...x,active:true});state.assignSlotPicker=s.id;render();},style:{padding:"4px 10px",borderRadius:"6px",border:"1px solid #86efac",fontSize:"10px",fontWeight:600,background:state.theme==="dark"?"#052e16":"#dcfce7",color:state.theme==="dark"?"#4ade80":"#15803d",cursor:"pointer",flexShrink:0}},"✓ Reactivate swimmer"));
      hdr.appendChild(removeBtn(e=>{e.stopPropagation();if(!confirm("Permanently delete "+s.name+"?"))return;state.swimmers=state.swimmers.filter(x=>x.id!==s.id);render();},"🗑"));
    }
    hdr.appendChild(el("span",{style:{fontSize:"10px",color:"#334155",marginLeft:"4px"}},isExp?"▲":"▼"));
    card.appendChild(hdr);

    // Expanded detail panel
    if(isExp){
      const detail=el("div",{style:{padding:"10px 14px",background:"var(--bg2)",borderTop:"1px solid var(--border)",display:"flex",flexDirection:"column",gap:"10px"}});

      // Usually Came + Last Session
      const allSessions=allAttendance.filter(h=>h.status==="attended"&&h.date).sort((a,b)=>b.date.localeCompare(a.date));
      const lastSession=allSessions[0];
      if(topDays.length||lastSession){
        const row2=el("div",{style:{display:"flex",gap:"12px",flexWrap:"wrap"}});
        if(topDays.length){
          const daysBlock=el("div",{style:{flex:1,minWidth:"100px"}});
          daysBlock.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase",fontWeight:700,marginBottom:"4px"}},"📆 Usually Came"));
          topDays.forEach(d=>daysBlock.appendChild(el("div",{style:{fontSize:"10px",color:"#94a3b8"}},d)));
          row2.appendChild(daysBlock);
        }
        if(lastSession){
          const lastBlock=el("div",{style:{flex:1,minWidth:"100px"}});
          lastBlock.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase",fontWeight:700,marginBottom:"4px"}},"🕐 Last Session"));
          lastBlock.appendChild(el("div",{style:{fontSize:"10px",color:"#94a3b8"}},new Date(lastSession.date+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})));
          row2.appendChild(lastBlock);
        }
        detail.appendChild(row2);
      }

      // Course history
      if(totalCourses>0){
        detail.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase",fontWeight:700,marginBottom:"4px"}},"📋 Course History"));
        const allCourses=[...history,...(s.currentCourse?[s.currentCourse]:[])].slice().reverse();
        allCourses.forEach(c=>{
          const p=PKG_TYPES[c.type]||PKG_TYPES.group;
          const sess=(c.history||[]).filter(h=>h.status==="attended").length;
          const pct=c.totalClasses>0?Math.min(1,sess/c.totalClasses):0;
          const crow=el("div",{style:{background:"var(--bg2)",borderRadius:"6px",padding:"6px 10px",marginBottom:"4px",border:"1px solid var(--border)"}});
          const ch=el("div",{style:{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap",marginBottom:"4px"}});
          ch.appendChild(el("span",{style:{fontSize:"9px",background:p.bg,color:p.color,borderRadius:"4px",padding:"1px 6px",border:"1px solid "+p.border,fontWeight:700}},p.label));
          if(c.startDate)ch.appendChild(el("span",{style:{fontSize:"9px",color:"#475569"}},new Date(c.startDate+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})));
          ch.appendChild(el("span",{style:{fontSize:"10px",color:sess>=(c.totalClasses||8)?"#4ade80":"#94a3b8",fontWeight:700,marginLeft:"auto"}},sess+"/"+(c.totalClasses||8)+(sess>=(c.totalClasses||8)?" ✓":"")));
          crow.appendChild(ch);
          // Dot boxes (same style as Register)
          const dots=el("div",{style:{display:"flex",gap:"2px",flexWrap:"wrap",marginTop:"3px"}});
          for(let i=0;i<Math.min(c.totalClasses||8,10);i++){
            dots.appendChild(el("div",{style:{width:"7px",height:"7px",borderRadius:"2px",background:i<sess?p.color:"var(--border)"}}));
          }
          crow.appendChild(dots);
          detail.appendChild(crow);
        });
      }

      card.appendChild(detail);
    }

    list.appendChild(card);
  });

  wrap.appendChild(list);
  return wrap;
}

// ── App root ───────────────────────────────────────────────────
function buildApp(){
  if(!state.currentUser)return buildLoginScreen();
  const app=el("div",{style:{fontFamily:"var(--font)",height:"100vh",background:"var(--bg)",color:"var(--text)",display:"flex",flexDirection:"row",overflow:"hidden"}});
  // Add modal lives outside render cycle - only create/destroy when showAdd changes
  if(state.showAdd&&!state._addModalCleanup){
    const addModal=buildAddModal();
    if(addModal){
      document.body.appendChild(addModal);
      state._addModalCleanup=()=>{addModal.remove();state._addModalCleanup=null;};
    }
  } else if(!state.showAdd&&state._addModalCleanup){
    state._addModalCleanup();
  }
  const confirmAddModal=buildConfirmAddModal();if(confirmAddModal)app.appendChild(confirmAddModal);
  const convertModal=buildConvertModal();if(convertModal)app.appendChild(convertModal);
  const shareModal=buildShareModal();if(shareModal)app.appendChild(shareModal);
  const pkgConfirm=buildPkgTypeConfirmModal();if(pkgConfirm)app.appendChild(pkgConfirm);
  const addUserModal=buildAddUserModal();if(addUserModal)app.appendChild(addUserModal);
  const poolClosureModal=buildPoolClosureModal();if(poolClosureModal)app.appendChild(poolClosureModal);

  // Date picker modal for register
  if(state.regDateModal){
    const dm=state.regDateModal;
    const overlay=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget){state.regDateModal=null;render();}}});
    const modal=el("div",{className:"modal modal-sm"});
    modal.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"16px"}},
      el("h2",{style:{fontSize:"15px",color:"var(--text)",fontWeight:700}},"📅 Change Date"),
      el("button",{onClick:()=>{state.regDateModal=null;render();},style:{background:"var(--surface2)",border:"none",color:"var(--text2)",borderRadius:"6px",padding:"4px 10px",fontSize:"13px"}},"✕")));
    const dateInp=el("input",{type:"date",value:dm.date,className:"iS",style:{fontSize:"16px",marginBottom:"16px",width:"100%",textAlign:"center"}});
    modal.appendChild(dateInp);
    modal.appendChild(el("button",{onClick:()=>{
      const newDate=dateInp.value;
      if(!newDate)return;
      state.registrations=state.registrations.map(r=>({...r,packages:(r.packages||[]).map(p=>p.id!==dm.pkgId?p:{...p,sessions:(p.sessions||[]).map(s=>s.id!==dm.sessId?s:{...s,date:newDate})})}));
      state.regDateModal=null;render();
    },style:{width:"100%",padding:"12px",borderRadius:"8px",border:"none",fontSize:"14px",fontWeight:700,background:"#2563eb",color:"#fff",cursor:"pointer"}},"✓ Confirm"));
    overlay.appendChild(modal);
    app.appendChild(overlay);
  }
  const addCoachModal=buildAddCoachModal();if(addCoachModal)app.appendChild(addCoachModal);
  const addClassTypeModal=buildAddClassTypeModal();if(addClassTypeModal)app.appendChild(addClassTypeModal);
  const newSaleModal=buildNewSaleModal();if(newSaleModal)app.appendChild(newSaleModal);
  // Post-sale: prompt to assign class if swimmers have none
  if(state.postSaleNoClassIds?.length){
    const names=state.postSaleNoClassIds.map(id=>state.swimmers.find(s=>s.id===id)?.name).filter(Boolean);
    const dismiss=()=>{state.postSaleNoClassIds=null;render();};
    const ov=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)dismiss();}});
    const box=el("div",{className:"modal modal-sm"});
    box.appendChild(el("div",{style:{fontSize:"14px",fontWeight:700,color:"#4ade80",marginBottom:"6px"}},"✓ Sale recorded!"));
    box.appendChild(el("div",{style:{fontSize:"11px",color:"#fbbf24",marginBottom:"14px"}},"⚠ "+names.join(", ")+(names.length>1?" are":" is")+" not assigned to a class yet."));
    const btnRow=el("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}});
    btnRow.appendChild(el("button",{onClick:()=>{dismiss();state.view="admin";state.adminTab="classes";render();},style:{padding:"10px",borderRadius:"8px",border:"none",fontSize:"12px",fontWeight:700,background:"#2563eb",color:"#fff",cursor:"pointer"}},"📋 Assign to Class Now"));
    btnRow.appendChild(el("button",{onClick:dismiss,style:{padding:"8px",borderRadius:"8px",border:"1px solid var(--border)",fontSize:"11px",background:"var(--bg3)",color:"var(--text3)",cursor:"pointer"}},"Later"));
    box.appendChild(btnRow);
    ov.appendChild(box);
    app.appendChild(ov);
  }
  // Assign class slot picker
  if(state.assignSlotPicker){
    const sw=state.swimmers.find(s=>s.id===state.assignSlotPicker);
    if(sw){
      const wasInactive=!sw.currentCourse;
      const dismiss=()=>{state.assignSlotPicker=null;render();};
      const ov=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)dismiss();}});
      const box=el("div",{className:"modal modal-sm"});

      // Header
      const sc=LC[a2l(sw.dob||sw.age)]||LC["Baby"];
      box.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"6px"}},
        el("div",null,
          el("div",{style:{fontSize:"14px",fontWeight:700,color:"var(--text)"}},"📅 Assign to Class"),
          el("div",{style:{fontSize:"11px",color:sc.color,marginTop:"2px"}},sw.name+(sw.parentName?" · "+sw.parentName:""))),
        el("button",{onClick:dismiss,style:{background:"var(--border)",border:"none",color:"var(--text2)",borderRadius:"6px",padding:"4px 10px",fontSize:"13px"}},"✕")));

      // Current assignment if any
      if(sw.assignedClassId){
        box.appendChild(el("div",{style:{fontSize:"9px",color:"#60a5fa",background:"var(--bg3)",borderRadius:"5px",padding:"4px 8px",marginBottom:"10px",border:"1px solid var(--border)"}},"Currently in: "+sw.assignedLabel));
      }

      const openDays=[...new Set(adminCls().filter(c=>!c.closed).map(c=>c.day))].sort((a,b)=>DAYS.indexOf(a)-DAYS.indexOf(b));
      const DAY_COLORS={Monday:"#fbbf24",Tuesday:"#f472b6",Wednesday:"#4ade80",Thursday:"#fb923c",Friday:"#60a5fa",Saturday:"#c084fc",Sunday:"#f87171"};

      // After-assign action panel (hidden initially)
      const afterPanel=el("div",{style:{display:"none",marginTop:"14px",borderTop:"1px solid var(--border)",paddingTop:"12px"}});
      const afterMsg=el("div",{style:{fontSize:"11px",color:"#4ade80",fontWeight:600,marginBottom:"10px"}});
      afterPanel.appendChild(afterMsg);
      if(wasInactive){
        afterPanel.appendChild(el("div",{style:{fontSize:"10px",color:"var(--text3)",marginBottom:"10px"}},"Would you also like to record a new sale?"));
        const btnRow=el("div",{style:{display:"flex",gap:"8px"}});
        btnRow.appendChild(el("button",{onClick:()=>{
          dismiss();
          state.showSaleForm=true;state.saleSelIds=[sw.id];
          state.salePkgType=sw.pkg||"group";state.salePayment="";state.saleDate=todayStr();
          render();
        },style:{flex:1,padding:"9px",borderRadius:"7px",border:"none",fontSize:"12px",fontWeight:700,background:"#2563eb",color:"#fff",cursor:"pointer"}},"💳 Record Sale"));
        btnRow.appendChild(el("button",{onClick:dismiss,style:{padding:"9px 14px",borderRadius:"7px",border:"1px solid var(--border)",fontSize:"11px",background:"var(--bg3)",color:"var(--text3)",cursor:"pointer"}},"Later"));
        afterPanel.appendChild(btnRow);
      } else {
        afterPanel.appendChild(el("button",{onClick:dismiss,style:{width:"100%",padding:"9px",borderRadius:"7px",border:"1px solid var(--border)",fontSize:"11px",background:"var(--bg3)",color:"var(--text3)",cursor:"pointer"}},"Done ✓"));
      }

      if(!openDays.length){
        box.appendChild(el("div",{style:{color:"var(--text3)",fontSize:"11px",textAlign:"center",padding:"20px"}},"No open classes available."));
      } else {
        const slotsWrap=el("div");
        openDays.forEach(day=>{
          const dayCls=adminCls().filter(c=>!c.closed&&c.day===day).sort((a,b)=>a.time.localeCompare(b.time));
          const dayColor=DAY_COLORS[day]||"#60a5fa";
          slotsWrap.appendChild(el("div",{style:{fontSize:"10px",fontWeight:700,color:dayColor,marginBottom:"6px",marginTop:"12px"}},day));
          const timeRow=el("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",marginBottom:"4px"}});
          dayCls.forEach(cls=>{
            const enrolled=cls.students.filter(s=>!s.transferTo).length;
            const full=enrolled>=cls.capacity;
            const alreadyIn=cls.students.some(s=>s.id===sw.id||s.name===sw.name);
            const wlCount=(cls.waitingList||[]).length;
            const btn=el("button",{
              disabled:alreadyIn,
              onClick:()=>{
                addSt(cls.id,sw,sw.pkg||"group");
                const nowFull=(adminCls().find(c=>c.id===cls.id)?.students.filter(s=>!s.transferTo).length||0)>=cls.capacity;
                const onWaitlist=(adminCls().find(c=>c.id===cls.id)?.waitingList||[]).some(w=>w.id===sw.id);
                if(!onWaitlist){
                  state.swimmers=state.swimmers.map(s=>s.id!==sw.id?s:{...s,assignedClassId:cls.id,assignedLabel:cls.day+" "+cls.time});
                  afterMsg.textContent="✓ "+sw.name+" added to "+cls.day+" "+cls.time;
                } else {
                  afterMsg.textContent="⏳ "+sw.name+" added to waitlist for "+cls.day+" "+cls.time;
                  afterMsg.style.color="#fb923c";
                }
                // Hide slots, show after panel
                slotsWrap.style.display="none";
                afterPanel.style.display="block";
              },
              style:{padding:"8px 12px",borderRadius:"7px",border:"1px solid",fontSize:"11px",fontWeight:600,
                cursor:alreadyIn?"not-allowed":"pointer",
                borderColor:alreadyIn?"#86efac":full?"#92400e":dayColor,
                background:alreadyIn?"#dcfce7":full?"#fff7ed":"var(--bg2)",
                color:alreadyIn?"#4ade80":full?"#fbbf24":dayColor,
                opacity:alreadyIn?0.6:1}
            },el("div",null,
              el("div",null,cls.time),
              el("div",{style:{fontSize:"9px",opacity:0.8}},alreadyIn?"✓ already in":full?"FULL"+(wlCount>0?" +"+wlCount+"w":""):(enrolled+"/"+cls.capacity))));
            timeRow.appendChild(btn);
          });
          slotsWrap.appendChild(timeRow);
        });
        box.appendChild(slotsWrap);
      }
      box.appendChild(afterPanel);
      ov.appendChild(box);
      app.appendChild(ov);
    }
  }
  // Family onboarding — all children in one card
  if(state.familyOnboard?.length){
    const children=state.familyOnboard.map(id=>state.swimmers.find(s=>s.id===id)).filter(Boolean);
    if(!children.length){state.familyOnboard=null;}
    else{
      if(!state.familyOnboardOpts){
        state.familyOnboardOpts={};
        children.forEach(sw=>{state.familyOnboardOpts[sw.id]={classSlot:"",buyCourse:false,pkgType:"group"};});
      }
      const opts=state.familyOnboardOpts;
      const DAY_COLORS={Monday:"#fbbf24",Tuesday:"#f472b6",Wednesday:"#4ade80",Thursday:"#fb923c",Friday:"#60a5fa",Saturday:"#c084fc",Sunday:"#f87171"};
      const openDays=[...new Set(adminCls().filter(c=>!c.closed).map(c=>c.day))].sort((a,b)=>DAYS.indexOf(a)-DAYS.indexOf(b));
      const ov=el("div",{className:"modal-overlay"});
      const box=el("div",{className:"modal",style:{maxWidth:"520px",maxHeight:"82vh",overflowY:"auto"}});
      box.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}},
        el("div",{style:{flex:1}},
          el("div",{style:{fontSize:"15px",fontWeight:700,color:"#c084fc"}},"Family Setup"),
          el("div",{style:{fontSize:"11px",color:"var(--text3)",marginTop:"2px"}},"Class and payment are both optional")),
        el("button",{onClick:()=>{state.familyOnboard=null;state.familyOnboardOpts=null;render();},style:{background:"var(--border)",border:"none",color:"var(--text2)",borderRadius:"6px",padding:"4px 10px",fontSize:"13px",cursor:"pointer"}},"X")));

      children.forEach(sw=>{
        const sc=LC[a2l(sw.dob||sw.age)]||LC["Baby"];
        const opt=opts[sw.id];
        const card=el("div",{style:{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"10px",padding:"12px",marginBottom:"10px"}});

        // Header
        card.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"12px"}},
          el("div",{style:{width:"30px",height:"30px",borderRadius:"50%",background:sc.bg,border:"2px solid "+sc.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"13px",fontWeight:700,color:sc.color,flexShrink:0}},sw.name.charAt(0).toUpperCase()),
          el("div",null,
            el("div",{style:{fontSize:"12px",fontWeight:700,color:"var(--text)"}},sw.name),
            el("div",{style:{fontSize:"10px",color:sc.color}},sc.emoji+" "+a2l(sw.dob||sw.age)))));

        // CLASS SLOT — independent, optional
        card.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase",marginBottom:"6px"}},"Assign Class (optional)"));
        const slotWrap=el("div",{style:{display:"flex",flexWrap:"wrap",gap:"4px",marginBottom:"12px"}});
        const allSlotBtns=[];
        // None button
        const noneBtn=el("button",{style:{padding:"5px 10px",borderRadius:"6px",border:"1px solid #4ade80",background:"#dcfce7",color:"#4ade80",fontSize:"10px",fontWeight:600,cursor:"pointer"}},"None");
        const updateSlots=()=>{
          const sel=opt.classSlot;
          noneBtn.style.borderColor=!sel?"#4ade80":"var(--border)";
          noneBtn.style.background=!sel?"#dcfce7":"transparent";
          noneBtn.style.color=!sel?"#4ade80":"#475569";
          allSlotBtns.forEach(b=>{
            const s=b._sk===sel;const f=b._full;const dc=b._dc;
            b.style.borderColor=s?dc:f?"#92400e":"var(--border)";
            b.style.background=s?"rgba(255,255,255,0.06)":f?"#fff7ed":"transparent";
            b.style.color=s?dc:f?"#fbbf24":"#475569";
          });
        };
        noneBtn.addEventListener("click",()=>{opt.classSlot="";updateSlots();});
        slotWrap.appendChild(noneBtn);
        openDays.forEach(day=>{
          const dc=DAY_COLORS[day]||"#60a5fa";
          adminCls().filter(c=>!c.closed&&c.day===day).sort((a,b)=>a.time.localeCompare(b.time)).forEach(cls=>{
            const sk=cls.day+"|"+cls.time;
            const full=cls.students.filter(s=>!s.transferTo).length>=cls.capacity;
            const btn=el("button",{style:{padding:"5px 10px",borderRadius:"6px",border:"1px solid var(--border)",background:"transparent",color:"#475569",fontSize:"10px",fontWeight:600,cursor:"pointer"}},cls.time+(full?" FULL":""));
            btn._sk=sk;btn._dc=dc;btn._full=full;
            btn.addEventListener("click",()=>{opt.classSlot=sk;updateSlots();});
            allSlotBtns.push(btn);slotWrap.appendChild(btn);
          });
        });
        updateSlots();
        card.appendChild(slotWrap);

        // PAYMENT — independent toggle + package
        const payRow=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",marginBottom:"8px"}});
        const toggle=el("button",{style:{width:"36px",height:"20px",borderRadius:"10px",border:"none",cursor:"pointer",position:"relative",flexShrink:0,background:opt.buyCourse?"#2563eb":"var(--border)"}});
        const knob=el("div",{style:{width:"14px",height:"14px",borderRadius:"50%",background:"#fff",position:"absolute",top:"3px",left:opt.buyCourse?"19px":"3px"}});
        toggle.appendChild(knob);
        const payLbl=el("span",{style:{fontSize:"11px",color:opt.buyCourse?"var(--text)":"var(--text3)",fontWeight:opt.buyCourse?600:400}},"Buy Course Now");
        payRow.appendChild(toggle);payRow.appendChild(payLbl);
        card.appendChild(payRow);
        const pkgRow=el("div",{style:{display:opt.buyCourse?"flex":"none",gap:"6px",marginBottom:"4px"}});
        Object.entries(PKG_TYPES).forEach(([k,p])=>{
          const active=opt.pkgType===k;
          const btn=el("button",{style:{flex:1,padding:"7px 2px",borderRadius:"6px",border:"1px solid",fontSize:"9px",fontWeight:700,cursor:"pointer",
            borderColor:active?p.border:"var(--border)",background:active?p.bg:"var(--bg2)",color:active?p.color:"#475569"}},p.label+"\n\u0E3F"+p.price.toLocaleString());
          btn.addEventListener("click",()=>{
            opt.pkgType=k;
            pkgRow.querySelectorAll("button").forEach((b,bi)=>{
              const[bk,bp]=Object.entries(PKG_TYPES)[bi];const a=bk===k;
              b.style.borderColor=a?bp.border:"var(--border)";b.style.background=a?bp.bg:"var(--bg2)";b.style.color=a?bp.color:"#475569";
            });
          });
          pkgRow.appendChild(btn);
        });
        toggle.addEventListener("click",()=>{
          opt.buyCourse=!opt.buyCourse;
          toggle.style.background=opt.buyCourse?"#2563eb":"var(--border)";
          knob.style.left=opt.buyCourse?"19px":"3px";
          payLbl.style.color=opt.buyCourse?"var(--text)":"var(--text3)";
          payLbl.style.fontWeight=opt.buyCourse?600:400;
          pkgRow.style.display=opt.buyCourse?"flex":"none";
        });
        card.appendChild(pkgRow);
        box.appendChild(card);
      });

      // Confirm
      const confirmBtn=el("button",{style:{width:"100%",padding:"12px",borderRadius:"8px",border:"none",fontSize:"13px",fontWeight:700,background:"#7c3aed",color:"#fff",cursor:"pointer",marginTop:"4px"}},
        "Confirm All ("+children.length+" child"+(children.length!==1?"ren":"")+")");
      confirmBtn.textContent="Confirm All ("+children.length+" child"+(children.length!==1?"ren":"")+")"
      confirmBtn.addEventListener("click",()=>{
        const today=todayStr();
        children.forEach(sw=>{
          const opt=opts[sw.id];
          // Buy course
          if(opt.buyCourse){swStartCourse(sw,opt.pkgType,today,PKG_TYPES[opt.pkgType]?.price||0);sw.pkg=opt.pkgType;}
          // Assign class (regardless of payment)
          if(opt.classSlot){
            const[day,time]=opt.classSlot.split("|");
            const cls=adminCls().find(c=>c.day===day&&c.time===time);
            if(cls){addSt(cls.id,sw,sw.pkg||"group");state.swimmers=state.swimmers.map(s=>s.id!==sw.id?s:{...s,assignedClassId:cls.id,assignedLabel:day+" "+time});}
          }
        });
        const bought=children.filter(sw=>opts[sw.id].buyCourse);
        state.familyOnboard=null;state.familyOnboardOpts=null;
        if(bought.length){state.view="sales";state.salesTab="transactions";state.txMonth=new Date().getFullYear()+"-"+new Date().getMonth();}
        render();
      });
      box.appendChild(confirmBtn);
      ov.appendChild(box);
      app.appendChild(ov);
    }
  }
  if(state.newSwOnboard){
    const sw=state.swimmers.find(s=>s.id===state.newSwOnboard);
    if(sw){
      const sc=LC[a2l(sw.dob||sw.age)]||LC["Baby"];
      const dismiss=()=>{state.newSwOnboard=null;render();};
      const ov=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)dismiss();}});
      const box=el("div",{className:"modal modal-sm"});
      box.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"16px"}},
        el("div",{style:{width:"40px",height:"40px",borderRadius:"50%",background:sc.bg,border:"2px solid "+sc.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"18px",fontWeight:700,color:sc.color}},sw.name.charAt(0).toUpperCase()),
        el("div",null,
          el("div",{style:{fontSize:"14px",fontWeight:700,color:"#4ade80"}},"✓ "+sw.name+" added!"),
          el("div",{style:{fontSize:"11px",color:"var(--text3)",marginTop:"2px"}},"What would you like to do next?"))));
      const btnWrap=el("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}});
      btnWrap.appendChild(el("button",{onClick:()=>{dismiss();state.assignSlotPicker=sw.id;render();},
        style:{padding:"12px",borderRadius:"8px",border:"1px solid var(--border)",background:"var(--bg2)",color:"var(--text)",fontSize:"12px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:"10px"}},
        el("span",{style:{fontSize:"20px"}},"🆕"),
        el("div",null,
          el("div",{style:{fontWeight:700,marginBottom:"2px"}},"Tryout"),
          el("div",{style:{fontSize:"10px",color:"var(--text3)"}},"Assign to a class, no payment yet"))));
      btnWrap.appendChild(el("button",{onClick:()=>{dismiss();state.showSaleForm=true;state.saleSelIds=[sw.id];state.salePkgType=sw.pkg||"group";state.salePayment="";state.saleDate=todayStr();render();},
        style:{padding:"12px",borderRadius:"8px",border:"1px solid #2563eb",background:"var(--bg3)",color:"var(--text)",fontSize:"12px",cursor:"pointer",textAlign:"left",display:"flex",alignItems:"center",gap:"10px"}},
        el("span",{style:{fontSize:"20px"}},"💳"),
        el("div",null,
          el("div",{style:{fontWeight:700,marginBottom:"2px"}},"Buy Course Now"),
          el("div",{style:{fontSize:"10px",color:"var(--text3)"}},"Record sale immediately"))));
      btnWrap.appendChild(el("button",{onClick:dismiss,
        style:{padding:"10px",borderRadius:"8px",border:"1px solid var(--border)",background:"var(--bg3)",color:"var(--text3)",fontSize:"11px",cursor:"pointer"}},"Later — just save profile"));
      box.appendChild(btnWrap);
      ov.appendChild(box);
      app.appendChild(ov);
    }
  }
  if(state.reactivatePrompt){
    const rsw=state.swimmers.find(s=>s.id===state.reactivatePrompt);
    if(rsw){
      const dismiss=()=>{state.reactivatePrompt=null;render();};
      const ov=el("div",{className:"modal-overlay",onClick:e=>{if(e.target===e.currentTarget)dismiss();}});
      const box=el("div",{className:"modal modal-sm"});
      box.appendChild(el("div",{style:{fontSize:"15px",fontWeight:700,color:"#4ade80",marginBottom:"8px"}},"✓ "+rsw.name+" reactivated!"));
      box.appendChild(el("div",{style:{fontSize:"11px",color:"var(--text3)",marginBottom:"16px"}},"What would you like to do next?"));
      const btnRow=el("div",{style:{display:"flex",flexDirection:"column",gap:"8px"}});
      btnRow.appendChild(el("button",{onClick:()=>{dismiss();state.showSaleForm=true;state.saleSelIds=[rsw.id];state.salePkgType=rsw.pkg||"group";state.salePayment="";state.saleDate=todayStr();render();},style:{padding:"10px",borderRadius:"8px",border:"none",fontSize:"12px",fontWeight:700,background:"#2563eb",color:"#fff",cursor:"pointer"}},"💳 Record New Sale"));
      btnRow.appendChild(el("button",{onClick:()=>{dismiss();state.view="admin";state.adminTab="classes";render();},style:{padding:"10px",borderRadius:"8px",border:"1px solid #2563eb",fontSize:"12px",fontWeight:600,background:"transparent",color:"#60a5fa",cursor:"pointer"}},"📋 Assign to Class"));
      btnRow.appendChild(el("button",{onClick:dismiss,style:{padding:"8px",borderRadius:"8px",border:"1px solid var(--border)",fontSize:"11px",background:"var(--bg3)",color:"var(--text3)",cursor:"pointer"}},"Later"));
      box.appendChild(btnRow);
      ov.appendChild(box);
      app.appendChild(ov);
    }
  }
  const deleteConfirmModal=buildDeleteConfirmModal();if(deleteConfirmModal)app.appendChild(deleteConfirmModal);
  const xferModal=buildXferModal();if(xferModal)app.appendChild(xferModal);
  const addClassModal=buildAddClassModal();if(addClassModal)app.appendChild(addClassModal);
  const regModal=buildRegisterModal();if(regModal)app.appendChild(regModal);

  // Sidebar (hidden on mobile via CSS)
  const sidebarEl=buildSidebar();
  sidebarEl.classList.add("sidebar-desktop");
  app.appendChild(sidebarEl);

  const main=el("div",{className:"main-scroll vh100",style:{flex:1,display:"flex",flexDirection:"column",overflowY:"auto",background:"var(--bg)"}});
  main.appendChild(buildTopBar());
  const content=el("div",{className:"main-content",style:{padding:"24px 28px",flex:1,maxWidth:"1000px",width:"100%",margin:"0 auto"}});
  if(state.view==="schedule")content.appendChild(buildScheduleView());
  else if(state.view==="coach")content.appendChild(buildCoachView());
  else if(state.view==="admin")content.appendChild(buildAdminView());
  else if(state.view==="swimmers")content.appendChild(buildSwimmersView());
  else if(state.view==="register")content.appendChild(buildRegisterView());
  else if(state.view==="profile")content.appendChild(buildProfileView());
  else if(state.view==="manageusers")content.appendChild(buildManageUsersView());
  else if(state.view==="sales")content.appendChild(buildSalesView());
  main.appendChild(content);
  app.appendChild(main);

  // Mobile bottom nav
  const isAdmin=state.currentUser?.role==="admin";
  const isCoach=state.currentUser?.role==="coach";
  const isGuest=state.currentUser?.role==="guest";
  const mobileNav=el("div",{className:"mobile-nav"});
  const mobileNavItems=isGuest?[
    {v:"schedule",icon:"📅",label:"Schedule"},
  ]:isCoach?[
    {v:"schedule",icon:"📅",label:"Schedule"},
    {v:"swimmers",icon:"🏊",label:"Swimmers"},
    {v:"register",icon:"📝",label:"Register"},
  ]:[
    {v:"schedule",icon:"📅",label:"Schedule"},
    {v:"admin",icon:"📋",label:"Classes"},
    {v:"swimmers",icon:"🏊",label:"Swimmers"},
    {v:"register",icon:"📝",label:"Register"},
    {v:"sales",icon:"📊",label:"Sales"},
    {v:"manageusers",icon:"⚙️",label:"More"},
  ];
  mobileNavItems.forEach(({v,icon,label})=>{
    const btn=el("button",{onClick:()=>{state.view=v;render();},className:state.view===v?"active":""});
    btn.appendChild(el("span",{className:"icon"},icon));
    btn.appendChild(el("span",{className:"label"},label));
    mobileNav.appendChild(btn);
  });
  app.appendChild(mobileNav);

  return app;
}
render();
</script>

<style>
#install-banner{
  display:none;position:fixed;bottom:80px;left:12px;right:12px;
  background:var(--surface);border:1px solid var(--border2);border-radius:14px;
  padding:14px 16px;z-index:9998;box-shadow:0 8px 32px rgba(0,0,0,0.4);
  align-items:center;gap:12px;animation:slideUp 0.3s ease;
}
#install-banner.show{display:flex;}
#install-banner .ib-icon{font-size:28px;flex-shrink:0;}
#install-banner .ib-text{flex:1;}
#install-banner .ib-title{font-size:13px;font-weight:700;color:var(--text);font-family:var(--font);}
#install-banner .ib-sub{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--font);}
#install-banner .ib-btn{padding:8px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;}
#install-banner .ib-dismiss{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
</style>

<div id="install-banner">
  <span class="ib-icon">🏊</span>
  <div class="ib-text">
    <div class="ib-title">Install RBSC Swim</div>
    <div class="ib-sub">Add to home screen for quick access</div>
  </div>
  <button class="ib-btn" id="install-btn">Install</button>
  <button class="ib-dismiss" id="install-dismiss">✕</button>
</div>

<script>
let _installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();_installPrompt=e;
  setTimeout(()=>{const b=document.getElementById('install-banner');if(b&&!localStorage.getItem('pwa-dismissed'))b.classList.add('show');},2500);
});
const ib=document.getElementById('install-btn');
if(ib)ib.addEventListener('click',async()=>{
  document.getElementById('install-banner').classList.remove('show');
  if(_installPrompt){await _installPrompt.prompt();_installPrompt=null;}
});
const id=document.getElementById('install-dismiss');
if(id)id.addEventListener('click',()=>{
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('pwa-dismissed','1');
});
window.addEventListener('appinstalled',()=>{document.getElementById('install-banner').classList.remove('show');_installPrompt=null;});

// iOS Safari hint
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true;
if(isIOS&&!isStandalone&&!localStorage.getItem('pwa-dismissed')){
  setTimeout(()=>{
    const b=document.getElementById('install-banner');if(!b)return;
    b.querySelector('.ib-sub').textContent='Tap the Share button → "Add to Home Screen"';
    const btn=b.querySelector('#install-btn');if(btn)btn.style.display='none';
    b.classList.add('show');
  },2500);
}
</script>
</body>
</html>
