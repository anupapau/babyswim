<style>
*{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:        #07111e;
  --bg2:       #0c1c2e;
  --bg3:       #102034;
  --surface:   #0f2236;
  --surface2:  #152a42;
  --border:    rgba(99,173,255,0.12);
  --border2:   rgba(99,173,255,0.2);
  --text:      #e4edf5;
  --text2:     #8ba7bf;
  --text3:     #4a6580;
  --accent:    #3b82f6;
  --accent2:   #60a5fa;
  --success:   #22c55e;
  --warning:   #f59e0b;
  --danger:    #ef4444;
  --radius:    10px;
  --radius-sm: 6px;
  --radius-lg: 14px;
  --shadow:    0 4px 24px rgba(0,0,0,0.4);
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
  --font:      'IBM Plex Sans', system-ui, sans-serif;
  --mono:      'IBM Plex Mono', monospace;
}

body{
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 20px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

#app{
  zoom: 1.15;
}

/* Counteract zoom on 100vh elements */
.vh100{ height: calc(100vh / 1.15); }

/* ── Mobile overrides ── */
@media(max-width:768px){
  body{ font-size:15px; }
  #app{ zoom:1; }
  .vh100{ height:100vh; }

  /* App layout: stack vertically, sidebar hidden */
  #app > div[style*="display:flex"]{
    flex-direction: column !important;
  }

  /* Sidebar: hide on mobile */
  .sidebar-desktop{ display:none !important; }

  /* Main: full width, leave room for bottom nav */
  .main-scroll{
    padding-bottom: 70px !important;
  }

  /* Topbar: compact */
  .topbar-inner{
    padding: 10px 14px !important;
    flex-wrap: nowrap !important;
    gap: 8px !important;
  }
  .topbar-legend{ display:none !important; }
  .topbar-share span{ display:none; }

  /* Bottom nav bar */
  .mobile-nav{
    display: flex !important;
  }

  /* Content padding */
  .main-content{
    padding: 14px 12px !important;
    max-width: 100% !important;
  }

  /* Modals: full screen on mobile */
  .modal{
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0 !important;
    padding: 20px 16px !important;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-overlay{
    align-items: flex-end !important;
    padding: 0 !important;
  }

  /* Cards: full width */
  div[style*="grid-template-columns"]{
    grid-template-columns: 1fr !important;
  }

  /* Stat rows: 2 columns */
  div[style*="minWidth:\"60px\""]{
    min-width: 60px;
  }

  /* Tables and wide rows: allow horizontal scroll */
  div[style*="overflowX:\"auto\""]{
    overflow-x: auto;
  }

  /* Buttons: larger tap targets */
  button{ min-height: 36px; }

  /* Input sizes */
  .iS{ font-size:16px !important; } /* prevents iOS zoom on input focus */
}

/* Mobile bottom nav */
.mobile-nav{
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border2);
  z-index: 100;
  padding: 6px 0 max(6px, env(safe-area-inset-bottom));
  justify-content: space-around;
}
.mobile-nav button{
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  background: none;
  border: none;
  color: var(--text3);
  font-size: 10px;
  font-weight: 600;
  padding: 4px 8px;
  min-height: unset;
  border-radius: 8px;
  flex: 1;
}
.mobile-nav button.active{
  color: var(--accent2);
  background: rgba(59,130,246,0.12);
}
.mobile-nav button span.icon{ font-size: 20px; line-height:1; }
.mobile-nav button span.label{ font-size: 9px; }


button{font-family:var(--font);cursor:pointer;transition:opacity 0.15s,background 0.15s,border-color 0.15s;}
button:hover{opacity:0.88;}
select,input,textarea{font-family:var(--font);}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(3,9,18,0.82);
  backdrop-filter:blur(4px);
  z-index:1000;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:fadeIn 0.15s ease;
}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 28px;
  width: 100%;
  max-width: 440px;
  box-shadow: var(--shadow);
  animation: slideUp 0.18s ease;
}
@keyframes slideUp{from{transform:translateY(12px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-sm{max-width:400px;}

/* Inputs */
.iS{
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 12px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  width: 100%;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.iS:focus{
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
}
.iS::placeholder{color:var(--text3);}

/* Labels */
.lS{
  font-size: 11px;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-weight: 600;
  display: block;
  margin-bottom: 5px;
}

/* Admin-add-list stays scrollable */
.admin-add-list{overflow-y:auto;}
</style>

function getWeeksInMonth(year,month){const weeks=[];const first=new Date(year,month,1);const last=new Date(year,month+1,0);let mon=getMonday(first);while(mon<=last){weeks.push(isoDate(mon));mon=addDays(mon,7);}return weeks;}

// ── DOM helper ─────────────────────────────────────────────────
function el(tag,attrs,...children){
  const elem=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(elem.style,v);
    else if(k.startsWith("on")&&typeof v==="function")elem.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")elem.className=v;
    else if(k==="disabled")elem.disabled=v;
    else elem.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{if(c==null||c===false)return;elem.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);});
  return elem;
}

function buildDobPicker(dKey,mKey,yKey,onChange){

  const ss={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"6px",padding:"6px 8px",color:"var(--text)",fontSize:"11px",outline:"none",flex:1};
  const dSel=el("select",{style:ss});dSel.appendChild(el("option",{value:""},"Day"));
  for(let i=1;i<=31;i++){const o=el("option",{value:String(i)},String(i));if(String(state[dKey])===String(i))o.selected=true;dSel.appendChild(o);}
  dSel.addEventListener("change",e=>{state[dKey]=e.target.value;onChange();});
  const mSel=el("select",{style:ss});mSel.appendChild(el("option",{value:""},"Month"));
  MONTHS.forEach((mn,i)=>{const o=el("option",{value:String(i+1)},mn);if(String(state[mKey])===String(i+1))o.selected=true;mSel.appendChild(o);});
  mSel.addEventListener("change",e=>{state[mKey]=e.target.value;onChange();});
  const curY=new Date().getFullYear();
  const ySel=el("select",{style:ss});ySel.appendChild(el("option",{value:""},"Year"));
  for(let y=curY;y>=curY-8;y--){const o=el("option",{value:String(y)},String(y));if(String(state[yKey])===String(y))o.selected=true;ySel.appendChild(o);}
  ySel.addEventListener("change",e=>{state[yKey]=e.target.value;onChange();});
  wrap.appendChild(dSel);wrap.appendChild(mSel);wrap.appendChild(ySel);
  return wrap;
}

function handleCSV(file){
  state.csvErr="";state.csvOk="";if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const lines=ev.target.result.trim().split(/\r?\n/);
      if(lines.length<2){state.csvErr="No valid rows.";render();return;}
      const hdrs=lines[0].split(",").map(h=>h.trim().toLowerCase());
      const parsed=lines.slice(1).map((line,i)=>{
        const vals=line.split(",").map(v=>v.trim());
        const obj={id:Date.now()+i+Math.random()};
        hdrs.forEach((h,hi)=>{obj[h]=vals[hi]||"";});
        obj.name=obj.name||obj["baby name"]||obj["swimmer"]||"Unknown";
        obj.dob=obj.dob||obj["date of birth"]||obj["date_of_birth"]||"";
        obj.age=obj.dob?"":obj.age||"—";
        obj.parentName=obj.parentname||obj["parent name"]||obj.parent||"";
        obj.memberId=obj.memberid||obj["member id"]||obj["member_id"]||obj["memberid"]||"";
        obj.pkg=(obj.package||obj.pkg||"").toLowerCase().includes("priv")?"private":"group";
        obj.assignedClassId=null;obj.babyId=genBabyId();return obj;
      }).filter(r=>r.name&&r.name!=="Unknown");
      if(!parsed.length){state.csvErr="No valid rows.";render();return;}
      const ex=new Set(state.swimmers.map(s=>s.name.toLowerCase()));
      const fr=parsed.filter(x=>!ex.has(x.name.toLowerCase()));
      state.swimmers=[...state.swimmers,...fr];state.csvOk="Imported "+fr.length+" swimmer(s).";render();
    }catch(e){state.csvErr="Parse error.";render();}
  };r.readAsText(file);
}

        item.addEventListener("mouseout",()=>item.style.background="#0d1f33");
        item.appendChild(el("span",{style:{fontSize:"11px",flexShrink:0}},r.icon));
        item.appendChild(el("span",{style:{fontSize:"9px",color:r.color,lineHeight:"1.3",fontWeight:500}},r.text));
        remWrap.appendChild(item);
      });
      sidebar.appendChild(remWrap);
    }
  }
  if(!isGuest){
    const now=new Date();
    const curYear=now.getFullYear(),curMonth=now.getMonth();
    const monthName=MONTHS[curMonth]+" "+curYear;
    const allMonthCls=[];
    Object.entries(state.weeklyClasses).forEach(([wIso,cls])=>{
      const wStart=new Date(wIso+"T00:00:00"),wEnd=addDays(wStart,6);
      const mStart=new Date(curYear,curMonth,1),mEnd=new Date(curYear,curMonth+1,0);
      if(wStart<=mEnd&&wEnd>=mStart)allMonthCls.push(...cls);
    });
    const totalClasses=allMonthCls.length;
    const totalConfirmed=allMonthCls.reduce((s,c)=>s+c.students.filter(st=>st.attendance==="confirmed").length,0);
    const activeSwimmers=state.swimmers.filter(s=>s.active!==false).length;
    const mPrefix=curYear+"-"+String(curMonth+1).padStart(2,"0");
    // Monthly income — sum all package payments this month
    let monthlyIncome=0;
    state.registrations.forEach(r=>{r.packages.forEach(p=>{if((p.startedAt||"").startsWith(mPrefix)&&p.payment)monthlyIncome+=p.payment;});});
    const statsWrap=el("div",{style:{padding:"8px 10px",borderTop:"1px solid var(--border)",flexShrink:0}});
    statsWrap.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"5px",paddingLeft:"2px",display:"flex",justifyContent:"space-between"}},
      el("span",null,"Overview"),el("span",{style:{color:"#334155",fontWeight:600}},monthName)));
    const baseStats=[
      {l:"Classes",v:totalClasses,c:"#94a3b8"},
      {l:"Confirmed",v:totalConfirmed,c:"#4ade80"},
      {l:"Active Swimmers",v:activeSwimmers,c:"#7dd3fc"},
    ];
    if(isAdmin)baseStats.push({l:"Income",v:"฿"+monthlyIncome.toLocaleString(),c:"#f59e0b"});
    baseStats.forEach(s=>{
      statsWrap.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"3px 6px",borderRadius:"5px",background:"#0d1f33",marginBottom:"2px",border:"1px solid var(--border)"}},el("span",{style:{fontSize:"10px",color:"var(--text3)"}},s.l),el("span",{style:{fontSize:"12px",fontWeight:700,color:s.c}},s.v)));
    });
    sidebar.appendChild(statsWrap);
  }

  return sidebar;
}

// ── Share Modal ────────────────────────────────────────────────
function buildShareModal(){
  if(!state.shareModal)return null;
  const sm=state.shareModal;
  const dismiss=()=>{state.shareModal=null;render();};
  const selStyle={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"var(--radius-sm)",padding:"8px 12px",color:"var(--text)",fontSize:"13px",outline:"none",width:"100%"};

  const box=el("div",{className:"modal modal-sm"});

    el("h2",{style:{fontSize:"15px",color:"var(--text)",fontWeight:700}},"📤 Share Schedule"),
    el("button",{onClick:dismiss,style:{background:"var(--surface2)",border:"none",color:"var(--text2)",borderRadius:"6px",padding:"4px 10px",fontSize:"13px"}},"✕")));

  // Day select
  box.appendChild(el("div",{style:{marginBottom:"14px"}},el("label",{className:"lS"},"Day")));
  const daySel=el("select",{style:selStyle});
  availDays.forEach(d=>{
    const dt=new Date();const todayIdx=dt.getDay()===0?6:dt.getDay()-1;
    const dayIdx=DAYS.indexOf(d);let diff=dayIdx-todayIdx;if(diff<=0)diff+=7;
    const target=new Date(dt);target.setDate(dt.getDate()+diff);
    const o=el("option",{value:d},d+" · "+target.toLocaleDateString("en-GB",{day:"numeric",month:"short"}));
    if(d===sm.day)o.selected=true;
    daySel.appendChild(o);
  });
  box.lastChild.appendChild(daySel);

  // Coach select
  box.appendChild(el("div",{style:{marginBottom:"14px"}},el("label",{className:"lS"},"Coach")));
  const coachSel=el("select",{style:selStyle});
  const rebuildCoachOptions=(day,selectedCoachId)=>{
    coachSel.innerHTML="";
    const o=el("option",{value:"all"},"All Coaches");
    if(selectedCoachId==="all")o.selected=true;
    coachSel.appendChild(o);
    state.coaches.filter(ch=>adminCls().some(c=>c.day===day&&c.coachId===ch.id)).forEach(ch=>{
      const opt=el("option",{value:ch.id},ch.name);
      if(String(ch.id)===String(selectedCoachId))opt.selected=true;
      coachSel.appendChild(opt);
    });
  };
  rebuildCoachOptions(sm.day,sm.coachId);
  box.lastChild.appendChild(coachSel);

  // Buttons — declared before updatePreview so it can reference confirmBtn
  const confirmBtn=el("button",{onClick:()=>{
    const coachFilter=coachSel.value==="all"?null:parseInt(coachSel.value);
    openSharePanel(daySel.value,coachFilter);dismiss();
  },style:{flex:1,padding:"10px 0",borderRadius:"var(--radius-sm)",border:"none",fontSize:"13px",fontWeight:700,cursor:"pointer",background:"#2563eb",color:"#fff"}},"📤 Open & Share");

  // Preview label
  const previewLabel=el("div",{style:{background:"var(--bg2)",borderRadius:"var(--radius-sm)",padding:"10px 14px",marginBottom:"16px",fontSize:"12px",color:"var(--text3)",border:"1px solid var(--border)"}});
  const updatePreview=()=>{
    const count=adminCls().filter(c=>c.day===daySel.value&&(coachSel.value==="all"||c.coachId===parseInt(coachSel.value))).length;
    previewLabel.textContent=count>0?`${count} class${count!==1?"es":""} will be included`:"No classes match this selection";
    confirmBtn.disabled=count===0;
    confirmBtn.style.background=count>0?"#2563eb":"var(--surface2)";
    confirmBtn.style.color=count>0?"#fff":"var(--text3)";
    confirmBtn.style.cursor=count>0?"pointer":"not-allowed";
  };
  box.appendChild(previewLabel);

  // Wire change events without re-rendering
  daySel.addEventListener("change",()=>{
    sm.day=daySel.value;sm.coachId="all";
    rebuildCoachOptions(daySel.value,"all");
    updatePreview();
  });
  coachSel.addEventListener("change",()=>{sm.coachId=coachSel.value;updatePreview();});

  box.appendChild(el("div",{style:{display:"flex",gap:"8px"}},
    confirmBtn,
    el("button",{onClick:dismiss,style:{padding:"10px 16px",borderRadius:"var(--radius-sm)",border:"1px solid var(--border)",fontSize:"12px",background:"transparent",color:"var(--text3)",cursor:"pointer"}},"Cancel")));

  updatePreview();
  overlay.appendChild(box);
  return overlay;
}

// ── Schedule view ──────────────────────────────────────────────

  MONTHS.forEach((mn,i)=>{const o=el("option",{value:i},mn);if(i===state.schedMonth)o.selected=true;mSel.appendChild(o);});
  navRow.appendChild(el("label",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"10px",color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.5px"}},"Month",mSel));
  const wSel=el("select",{onChange:e=>{state.schedWeekStart=e.target.value;render();},style:selStyle});
  getWeeksInMonth(state.schedYear,state.schedMonth).forEach(wIso=>{const wd=new Date(wIso+"T00:00:00");const we=addDays(wd,6);const isNow=wIso===todayMonday;const o=el("option",{value:wIso},wd.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+" – "+we.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+(isNow?" (this week)":""));if(wIso===state.schedWeekStart)o.selected=true;wSel.appendChild(o);});

// ── Advance Booking helpers ─────────────────────────────────────
function injectAdvanceBookings(weekIso){
  const wkCls=clsForWeek(weekIso);if(!wkCls.length)return;
  const pending=state.advanceBookings.filter(b=>b.weekIso===weekIso&&b.status==="pending");
  if(!pending.length)return;
  let updated=JSON.parse(JSON.stringify(wkCls));let injected=0;
  pending.forEach(b=>{
    const ci=updated.findIndex(c=>c.day===b.day&&c.time===b.time);if(ci<0)return;
    if(updated[ci].students.some(s=>s.name===b.swimmerName))return;
    const sw=state.swimmers.find(s=>s.name===b.swimmerName&&s.active!==false);if(!sw)return;
    updated[ci].students.push({id:Date.now()+Math.random(),name:sw.name,dob:sw.dob||"",age:sw.age||"",parentName:sw.parentName||"",attendance:"confirmed",staple:false,pkg:sw.pkg||"group",transferTo:null,bookedAdvance:true});
    injected++;
  });
  if(injected){setWkCls(weekIso,updated);state.advanceBookings=state.advanceBookings.map(b=>b.weekIso===weekIso&&b.status==="pending"?{...b,status:"injected"}:b);}
}

  // ── Pending Tryouts banner (sales tab) ──
  if(pendingTryouts.length>0){
    const tryBanner=el("div",{style:{background:"#0f2000",border:"1px solid #4d7c0f",borderRadius:"9px",padding:"10px 14px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"10px",flexWrap:"wrap",cursor:"pointer"},onClick:()=>{state.salesTab="tryout";render();}});
    tryBanner.appendChild(el("span",{style:{fontSize:"16px"}},"🟢"));
    tryBanner.appendChild(el("div",{style:{flex:1}},
      el("div",{style:{fontSize:"12px",fontWeight:700,color:"#a3e635"}},pendingTryouts.length+" tryout"+(pendingTryouts.length!==1?"s":"")+" pending conversion"),
      el("div",{style:{fontSize:"10px",color:"#65a30d",marginTop:"2px"}},pendingTryouts.map(t=>t.swimmerName).join(", "))));
    tryBanner.appendChild(el("span",{style:{fontSize:"10px",color:"#a3e635"}},"View →"));
    wrap.appendChild(tryBanner);
  }

  // ── Month picker ──
  const pickerRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"16px",alignItems:"center",flexWrap:"wrap"}});
  const ySel=el("select",{onChange:e=>{state.salesYear=parseInt(e.target.value);render();},style:selStyle});
  for(let y=baseY-2;y<=baseY+1;y++){const o=el("option",{value:y},String(y));if(y===state.salesYear)o.selected=true;ySel.appendChild(o);}
  pickerRow.appendChild(el("label",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"10px",color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.5px"}},"Year",ySel));
  const mSel=el("select",{onChange:e=>{state.salesMonth=parseInt(e.target.value);render();},style:selStyle});
  MONTHS.forEach((mn,i)=>{const o=el("option",{value:i},mn);if(i===state.salesMonth)o.selected=true;mSel.appendChild(o);});
  pickerRow.appendChild(el("label",{style:{display:"flex",alignItems:"center",gap:"6px",fontSize:"10px",color:"var(--text3)",textTransform:"uppercase",letterSpacing:"0.5px"}},"Month",mSel));
  pickerRow.appendChild(el("div",{style:{flex:1}}));
  const now=new Date();
  if(state.salesYear!==now.getFullYear()||state.salesMonth!==now.getMonth())
    pickerRow.appendChild(el("button",{onClick:()=>{state.salesYear=now.getFullYear();state.salesMonth=now.getMonth();render();},style:{padding:"6px 12px",borderRadius:"7px",border:"none",fontSize:"11px",fontWeight:600,background:"#2563eb",color:"#fff",cursor:"pointer"}},"This Month"));
  wrap.appendChild(pickerRow);

  // ── Build rows — exclude tryouts ──
  const mPrefix=state.salesYear+"-"+String(state.salesMonth+1).padStart(2,"0");
  const rows=[];
  state.registrations.forEach(reg=>{
    reg.packages.forEach((pkg,pkgIdx)=>{
      if(!(pkg.startedAt||"").startsWith(mPrefix))return;
      if(pkg.type==="tryout")return;
      const isFirst=pkgIdx===0||reg.packages.slice(0,pkgIdx).every(p=>p.type==="tryout");
      const continueCount=reg.packages.slice(0,pkgIdx).filter(p=>p.type!=="tryout").length;
      const sw=state.swimmers.find(s=>s.name===reg.swimmerName);
      rows.push({
        parentName:reg.parentName||sw?.parentName||"—",
        swimmerName:reg.swimmerName,
        memberId:sw?.memberId||"—",
        babyId:sw?.babyId||"—",
        contactNumber:reg.contactNumber||sw?.contactNumber||pkg.contactNumber||"—",
        pkgType:pkg.type,
        isFirst,continueCount,
        date:pkg.startedAt||"—",
        payment:pkg.payment!=null?pkg.payment:null,
        regId:reg.id,pkgId:pkg.id,swId:sw?.id||null,
      });
    });
  });

  // Stats
  const total=rows.length,firstTime=rows.filter(r=>r.isFirst).length,cont=rows.filter(r=>!r.isFirst).length;
  const byType={};rows.forEach(r=>{byType[r.pkgType]=(byType[r.pkgType]||0)+1;});
  const statsRow=el("div",{style:{display:"flex",gap:"8px",marginBottom:"14px",flexWrap:"wrap"}});
  [{l:"Total",v:total,c:"#7dd3fc"},{l:"First Time",v:firstTime,c:"#4ade80"},{l:"Continuing",v:cont,c:"#f59e0b"},...Object.entries(byType).map(([k,v])=>({l:(PKG_TYPES[k]?.label||k),v,c:(PKG_TYPES[k]?.color||"#94a3b8")}))].forEach(s=>{
    statsRow.appendChild(el("div",{style:{background:"#0d1f33",borderRadius:"9px",padding:"10px 14px",border:"1px solid var(--border)",minWidth:"80px"}},
      el("div",{style:{fontSize:"22px",fontWeight:700,color:s.c}},s.v),
      el("div",{style:{fontSize:"9px",color:"var(--text3)",textTransform:"uppercase",marginTop:"2px"}},s.l)));
  });
  wrap.appendChild(statsRow);

  if(rows.length===0){
    wrap.appendChild(el("div",{style:{textAlign:"center",padding:"48px 16px",color:"var(--text3)",border:"1px dashed #1e3a5f",borderRadius:"10px",fontSize:"12px"}},
      el("div",{style:{fontSize:"32px",marginBottom:"10px"}},"📊"),
      el("div",{style:{fontWeight:600,color:"var(--text3)",marginBottom:"4px"}},"No packages in "+MONTHS[state.salesMonth]+" "+state.salesYear),
      "Use ➕ New Sale above to record a course purchase."));
    return wrap;
  }

  rows.sort((a,b)=>b.date.localeCompare(a.date));
  const tbl=el("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden"}});
  rows.forEach((r,i)=>{
    const p=PKG_TYPES[r.pkgType]||PKG_TYPES.group;
    const block=el("div",{style:{padding:"10px 14px",borderBottom:i<rows.length-1?"1px solid #0d1a2a":"none",background:i%2===0?"#0d1f33":"#0a1624"}});
    // Line 1: name + parent + baby ID + contact
    const line1=el("div",{style:{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap",marginBottom:"5px"}});
    const nameBlock=el("div",{style:{flex:1,minWidth:"140px"}});
    nameBlock.appendChild(el("div",{style:{fontSize:"11px",color:"var(--text)",fontWeight:700,display:"flex",alignItems:"center",gap:"6px"}},r.swimmerName,r.babyId!=="—"?el("span",{style:{fontSize:"9px",color:"#c084fc",fontFamily:"monospace",background:"#1a0a2e",borderRadius:"3px",padding:"1px 5px",border:"1px solid #7c3aed"}},r.babyId):null));
    nameBlock.appendChild(el("div",{style:{fontSize:"10px",color:"var(--text2)",marginTop:"1px"}},r.parentName));
    line1.appendChild(nameBlock);
    if(r.memberId!=="—")line1.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",textAlign:"right"}},el("div",{style:{color:"var(--text3)",fontSize:"8px",textTransform:"uppercase"}},"Member ID"),r.memberId));
    if(r.contactNumber!=="—")line1.appendChild(el("div",{style:{fontSize:"9px",color:"#93c5fd",textAlign:"right"}},el("div",{style:{color:"var(--text3)",fontSize:"8px",textTransform:"uppercase"}},"Contact"),r.contactNumber));
    line1.appendChild(el("div",{style:{fontSize:"9px",color:"var(--text3)",textAlign:"right",marginLeft:"auto"}},el("div",{style:{color:"var(--text3)",fontSize:"8px",textTransform:"uppercase"}},"Date"),r.date!=="—"?new Date(r.date+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):r.date));
    block.appendChild(line1);
    // Line 2: package badge + first/continue + payment
    const line2=el("div",{style:{display:"flex",alignItems:"center",gap:"8px",flexWrap:"wrap"}});
    line2.appendChild(el("span",{style:{fontSize:"9px",background:p.bg,color:p.color,borderRadius:"4px",padding:"2px 8px",border:`1px solid ${p.border}`,fontWeight:700}},p.label));
    line2.appendChild(r.isFirst
      ?el("span",{style:{fontSize:"9px",background:"#052e16",color:"#4ade80",borderRadius:"4px",padding:"1px 7px",border:"1px solid #166534",fontWeight:700}},"✨ First Time")
      :el("span",{style:{fontSize:"9px",background:"#1c0a00",color:"#fb923c",borderRadius:"4px",padding:"1px 7px",border:"1px solid #92400e",fontWeight:700}},"🔁 Continue #"+r.continueCount));
    if(!r.isFirst)line2.appendChild(el("span",{style:{fontSize:"9px",color:"var(--text3)"}},"× "+r.continueCount));
    line2.appendChild(el("div",{style:{flex:1}}));
    if(r.payment!=null)line2.appendChild(el("span",{style:{fontSize:"11px",color:"#4ade80",fontWeight:700}},"฿"+r.payment.toLocaleString()));
    else line2.appendChild(el("span",{style:{fontSize:"10px",color:"#334155"}},"฿—"));
    line2.appendChild(el("button",{onClick:()=>{
      state.deleteConfirm={
        name:r.swimmerName+" — "+((PKG_TYPES[r.pkgType]||{}).label||r.pkgType)+" on "+r.date,
        label:"Delete this sale record",
        onConfirm:()=>{
          state.registrations=state.registrations.map(reg=>{
            if(reg.id!==r.regId)return reg;
            const newPkgs=reg.packages.filter(p=>p.id!==r.pkgId);
            // If no packages left, archive the registration
            if(!newPkgs.length)return{...reg,active:false,packages:reg.packages};
            return{...reg,packages:newPkgs};
          });
          render();
        }
      };render();
    },style:{padding:"2px 7px",borderRadius:"5px",border:"1px solid #7f1d1d",fontSize:"9px",background:"#450a0a",color:"#f87171",cursor:"pointer",flexShrink:0}},"🗑"));
    block.appendChild(line2);
    tbl.appendChild(block);
  });
  wrap.appendChild(tbl);
  return wrap;
}


// ── Inactive Swimmers view ─────────────────────────────────────
function buildInactiveContent(isCoach){
  const wrap=el("div",null);
  const inactive=state.swimmers.filter(s=>s.active===false);
  wrap.appendChild(el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"14px",flexWrap:"wrap",gap:"8px"}},
    el("div",null,el("h2",{style:{fontSize:"14px",color:"var(--text)",fontWeight:700,marginBottom:"3px"}},"🚫 Inactive Swimmers"),el("p",{style:{fontSize:"11px",color:"var(--text3)"}},inactive.length+" swimmer"+(inactive.length!==1?"s":"")+" inactive"))));
  if(inactive.length===0){
    wrap.appendChild(el("div",{style:{textAlign:"center",padding:"40px 16px",color:"var(--text3)",fontSize:"12px",border:"1px dashed #1e3a5f",borderRadius:"10px"}},el("div",{style:{fontSize:"28px",marginBottom:"8px"}},"✅"),"No inactive swimmers."));
    return wrap;
  }
  const list=el("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius)",overflow:"hidden"}});
  inactive.forEach((s,i)=>{
    const sc=LC[a2l(s.dob||s.age)];
    list.appendChild(el("div",{style:{display:"flex",alignItems:"center",gap:"8px",padding:"10px 14px",borderBottom:"1px solid var(--border)",background:i%2===0?"#0d1f33":"#0a1624",flexWrap:"wrap",opacity:"0.8"}},
      el("div",{style:{width:"22px",height:"22px",borderRadius:"50%",background:"#171717",border:"1px solid #404040",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"9px",fontWeight:700,color:"var(--text3)"}},s.name.charAt(0)),
        el("div",{style:{flex:1,minWidth:"80px"}},
        el("div",{style:{display:"flex",alignItems:"center",gap:"6px",flexWrap:"wrap"}},
          el("div",{style:{fontSize:"11px",color:"var(--text2)",fontWeight:500}},s.name),
          s.babyId?el("span",{style:{fontSize:"9px",background:"#1a0a2e",color:"#c084fc",borderRadius:"4px",padding:"1px 6px",border:"1px solid #7c3aed",fontWeight:700,fontFamily:"monospace"}},s.babyId):null),
        el("div",{style:{fontSize:"9px",color:"var(--text3)"}},(s.parentName?s.parentName+" · ":"")+displayAge(s)+" · "+sc.emoji+" "+a2l(s.dob||s.age)+(s.memberId?" · Member: "+s.memberId:""))),
      (!isCoach?el("button",{onClick:()=>{state.swimmers=state.swimmers.map(x=>x.id!==s.id?x:{...x,active:true});render();},style:{padding:"4px 12px",borderRadius:"6px",border:"1px solid #166534",fontSize:"10px",fontWeight:600,background:"#052e16",color:"#4ade80",cursor:"pointer"}},"✓ Reactivate"):null),
      (!isCoach?el("button",{onClick:()=>{if(!confirm("Permanently delete "+s.name+"?"))return;state.swimmers=state.swimmers.filter(x=>x.id!==s.id);render();},style:{padding:"4px 9px",borderRadius:"6px",border:"1px solid #7f1d1d",fontSize:"10px",background:"#450a0a",color:"#f87171",cursor:"pointer"}},"🗑 Delete"):null)));
  });
  wrap.appendChild(list);
  return wrap;
}

// ── App root ───────────────────────────────────────────────────
function buildApp(){
  if(!state.currentUser)return buildLoginScreen();
  const app=el("div",{style:{fontFamily:"var(--font)",height:"100vh",background:"var(--bg)",color:"var(--text)",display:"flex",overflow:"hidden"}});
  const addModal=buildAddModal();if(addModal)app.appendChild(addModal);
  const confirmAddModal=buildConfirmAddModal();if(confirmAddModal)app.appendChild(confirmAddModal);
  const convertModal=buildConvertModal();if(convertModal)app.appendChild(convertModal);
  const shareModal=buildShareModal();if(shareModal)app.appendChild(shareModal);
  const pkgConfirm=buildPkgTypeConfirmModal();if(pkgConfirm)app.appendChild(pkgConfirm);
  const addUserModal=buildAddUserModal();if(addUserModal)app.appendChild(addUserModal);
  const addCoachModal=buildAddCoachModal();if(addCoachModal)app.appendChild(addCoachModal);
  const addClassTypeModal=buildAddClassTypeModal();if(addClassTypeModal)app.appendChild(addClassTypeModal);
  const newSaleModal=buildNewSaleModal();if(newSaleModal)app.appendChild(newSaleModal);
  const deleteConfirmModal=buildDeleteConfirmModal();if(deleteConfirmModal)app.appendChild(deleteConfirmModal);
  const xferModal=buildXferModal();if(xferModal)app.appendChild(xferModal);
  const addClassModal=buildAddClassModal();if(addClassModal)app.appendChild(addClassModal);
  const regModal=buildRegisterModal();if(regModal)app.appendChild(regModal);

  // Sidebar (hidden on mobile via CSS)
  const sidebarEl=buildSidebar();
  sidebarEl.classList.add("sidebar-desktop");
  app.appendChild(sidebarEl);

  const main=el("div",{className:"main-scroll vh100",style:{flex:1,display:"flex",flexDirection:"column",overflowY:"auto",background:"var(--bg)"}});
  main.appendChild(buildTopBar());
  const content=el("div",{className:"main-content",style:{padding:"24px 28px",flex:1,maxWidth:"1000px",width:"100%",margin:"0 auto"}});
  if(state.view==="schedule")content.appendChild(buildScheduleView());
  else if(state.view==="coach")content.appendChild(buildCoachView());
  else if(state.view==="admin")content.appendChild(buildAdminView());
  else if(state.view==="swimmers")content.appendChild(buildSwimmersView());
  else if(state.view==="register")content.appendChild(buildRegisterView());
  else if(state.view==="manageusers")content.appendChild(buildManageUsersView());
  else if(state.view==="sales")content.appendChild(buildSalesView());
  main.appendChild(content);
  app.appendChild(main);

  // Mobile bottom nav
  const isAdmin=state.currentUser?.role==="admin";
  const isCoach=state.currentUser?.role==="coach";
  const isGuest=state.currentUser?.role==="guest";
  const mobileNav=el("div",{className:"mobile-nav"});
  const mobileNavItems=isGuest?[
    {v:"schedule",icon:"📅",label:"Schedule"},
  ]:isCoach?[
    {v:"schedule",icon:"📅",label:"Schedule"},
    {v:"coach",icon:"👁",label:"Coach"},
    {v:"swimmers",icon:"📋",label:"Swimmers"},
    {v:"register",icon:"📝",label:"Register"},
  ]:[
    {v:"schedule",icon:"📅",label:"Schedule"},
    {v:"admin",icon:"⚙",label:"Classes"},
    {v:"swimmers",icon:"📋",label:"Swimmers"},
    {v:"sales",icon:"📊",label:"Sales"},
    {v:"manageusers",icon:"⚙️",label:"Control"},
  ];
  mobileNavItems.forEach(({v,icon,label})=>{
    const btn=el("button",{onClick:()=>{state.view=v;render();},className:state.view===v?"active":""});
    btn.appendChild(el("span",{className:"icon"},icon));
    btn.appendChild(el("span",{className:"label"},label));
    mobileNav.appendChild(btn);
  });
  app.appendChild(mobileNav);

  return app;
}
render();
</script>

<style>
#install-banner{
  display:none;position:fixed;bottom:80px;left:12px;right:12px;
  background:var(--surface);border:1px solid var(--border2);border-radius:14px;
  padding:14px 16px;z-index:9998;box-shadow:0 8px 32px rgba(0,0,0,0.4);
  align-items:center;gap:12px;animation:slideUp 0.3s ease;
}
#install-banner.show{display:flex;}
#install-banner .ib-icon{font-size:28px;flex-shrink:0;}
#install-banner .ib-text{flex:1;}
#install-banner .ib-title{font-size:13px;font-weight:700;color:var(--text);font-family:var(--font);}
#install-banner .ib-sub{font-size:11px;color:var(--text3);margin-top:2px;font-family:var(--font);}
#install-banner .ib-btn{padding:8px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);white-space:nowrap;}
#install-banner .ib-dismiss{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:0;line-height:1;flex-shrink:0;}
</style>

<div id="install-banner">
  <span class="ib-icon">🏊</span>
  <div class="ib-text">
    <div class="ib-title">Install RBSC Swim</div>
    <div class="ib-sub">Add to home screen for quick access</div>
  </div>
  <button class="ib-btn" id="install-btn">Install</button>
  <button class="ib-dismiss" id="install-dismiss">✕</button>
</div>

<script>
let _installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();_installPrompt=e;
  setTimeout(()=>{const b=document.getElementById('install-banner');if(b&&!localStorage.getItem('pwa-dismissed'))b.classList.add('show');},2500);
});
const ib=document.getElementById('install-btn');
if(ib)ib.addEventListener('click',async()=>{
  document.getElementById('install-banner').classList.remove('show');
  if(_installPrompt){await _installPrompt.prompt();_installPrompt=null;}
});
const id=document.getElementById('install-dismiss');
if(id)id.addEventListener('click',()=>{
  document.getElementById('install-banner').classList.remove('show');
  localStorage.setItem('pwa-dismissed','1');
});
window.addEventListener('appinstalled',()=>{document.getElementById('install-banner').classList.remove('show');_installPrompt=null;});

// iOS Safari hint
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const isStandalone=window.navigator.standalone===true;
if(isIOS&&!isStandalone&&!localStorage.getItem('pwa-dismissed')){
  setTimeout(()=>{
    const b=document.getElementById('install-banner');if(!b)return;
    b.querySelector('.ib-sub').textContent='Tap the Share button → "Add to Home Screen"';
    const btn=b.querySelector('#install-btn');if(btn)btn.style.display='none';
    b.classList.add('show');
  },2500);
}
</script>
</body>
</html>
